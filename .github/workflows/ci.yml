name: ci

# Implements the 28-stage pipeline from docs/mvp1/04-devops-sre-blueprint.md §7.
# Blocking gates: tenant-isolation / audit / salary / architecture tests,
# dependency/SCA gate (trivy fs, HIGH/CRITICAL), container scans, secret scans,
# image build & push (on main).

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress pipelines for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Individual jobs widen as required.
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  JAVA_DIST: temurin
  NODE_VERSION: "22"
  MAVEN_CLI_OPTS: "-B -ntp -e -Dstyle.color=always"
  REGISTRY: ghcr.io
  # OCI/Docker references MUST be lowercase. github.repository is
  # "aziz-bek01/Grading" (capital G); docker push normalizes it, but syft
  # (sbom) and trivy (image-scan) parse the raw ref and reject the capital.
  # Hardcode the lowercased namespace so build, image-scan, and sbom all agree
  # — and it matches the images deploy.yml already publishes.
  IMAGE_BACKEND: ghcr.io/aziz-bek01/grading/grading-api
  IMAGE_FRONTEND: ghcr.io/aziz-bek01/grading/grading-frontend

jobs:

  # ===========================================================================
  # Stage 1-2 — Checkout + commit / branch validation
  # ===========================================================================
  validate:
    name: "01 · validate"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Validating branch: $BRANCH"
          # `claude/...` is the auto-generated prefix for Claude Code on the web
          # sessions — allow it alongside the conventional <type>/<slug> set.
          if ! echo "$BRANCH" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert|claude)/[a-z0-9._-]+$|^(main|develop|release/.+|hotfix/.+)$'; then
            echo "::error::Branch name '$BRANCH' does not follow <type>/<slug> convention."
            exit 1
          fi

      - name: Conventional commit lint
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.cjs

  # ===========================================================================
  # Stage 3 — Secret scan (gitleaks)
  # ===========================================================================
  secret-scan:
    name: "02 · secret-scan"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Account-level Actions artifact storage is full; the scan itself still
          # runs and gates on real leaks — only the optional result-artifact
          # upload is disabled so a storage-quota error can't fail this job.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ===========================================================================
  # Stage 4 — Dependency / SCA scans (trivy fs).
  #   SEC-009: trivy fs is a BUILD-FAILING GATE on fixable HIGH/CRITICAL
  #   findings (see /.trivyignore for the per-CVE allowlist). npm audit stays
  #   informational — trivy fs already gates the npm lockfile, so gating on
  #   npm audit too would just double-count a noisier source.
  # ===========================================================================
  backend-deps-scan:
    name: "03 · backend-deps-scan"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # trivy fs resolves backend/pom.xml's Spring Boot parent + imported BOMs to
      # build the dependency graph. By default it fetches those POMs from
      # repo1.maven.org, which intermittently 429-rate-limits the shared CI egress
      # on freshly-bumped coordinates (e.g. spring-boot-starter-parent 3.5.14) and
      # flakily fails this gate. Pre-populate ~/.m2 (kept warm across runs by
      # setup-java's maven cache) so trivy resolves those POMs from the LOCAL repo
      # instead of the network — this is Trivy's own documented remedy for the 429.
      # retryHandler rides out a cold-cache blip on the first run after a bump.
      - name: Warm local Maven repo for trivy (resolve parent POM + BOMs into ~/.m2)
        working-directory: backend
        run: ./mvnw -B -ntp -q -Dmaven.wagon.http.retryHandler.count=5 dependency:resolve

      # trivy-action@v0.x pins an internal setup-trivy version GitHub can no
      # longer resolve (fails at job setup). The shared composite installs the
      # CLI from a version-pinned installer with retry + a fail-closed version
      # assert (see .github/actions/install-trivy) — one source of truth for
      # every trivy install below.
      - name: Install trivy
        uses: ./.github/actions/install-trivy

      # SEC-009 — SCA GATE. trivy fs parses backend/pom.xml and FAILS the job on
      # any FIXABLE (--ignore-unfixed) HIGH/CRITICAL not explicitly allow-listed
      # in /.trivyignore (per-CVE, with justification + review date). Unfixable /
      # false-positive noise cannot spuriously break CI. Table output so the
      # offending CVEs are visible directly in the job log.
      - name: Trivy filesystem SCA gate (backend) [HIGH,CRITICAL]
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 --format table backend

      # Informational re-run (never fails) emitting SARIF for the Security tab.
      # Same severity + same .trivyignore so it mirrors exactly what the gate
      # enforced; trivy reuses the vuln DB cached by the gate step above.
      - name: Trivy SARIF (backend, informational)
        if: always()
        continue-on-error: true
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 0 \
            --format sarif --output trivy-backend-fs.sarif backend

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-fs.sarif
          category: trivy-backend-fs

  frontend-deps-scan:
    name: "04 · frontend-deps-scan"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (high+)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          # Informational: surface advisories as a warning annotation but don't
          # fail the quality gate on transitive high-severity advisories.
          npm audit --audit-level=high || echo "::warning::npm audit found high-severity advisories (non-blocking)"

      # See backend-deps-scan: shared version-pinned + fail-closed trivy install.
      - name: Install trivy
        uses: ./.github/actions/install-trivy

      # SEC-009 — SCA GATE. trivy fs parses frontend/package-lock.json and FAILS
      # the job on any FIXABLE HIGH/CRITICAL not allow-listed in /.trivyignore.
      # This is the enforcing gate for npm deps; `npm audit` above stays
      # informational to avoid double-gating with a noisier source.
      - name: Trivy filesystem SCA gate (frontend) [HIGH,CRITICAL]
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 --format table frontend

      # Informational re-run (never fails) emitting SARIF for the Security tab.
      - name: Trivy SARIF (frontend, informational)
        if: always()
        continue-on-error: true
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 0 \
            --format sarif --output trivy-frontend-fs.sarif frontend

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-fs.sarif
          category: trivy-frontend-fs

  # ===========================================================================
  # Stage 5 — SAST (Spotbugs for backend, ESLint security rules for frontend)
  # ===========================================================================
  backend-sast:
    name: "05 · backend-sast"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Spotbugs is invoked via the Maven plugin; the plugin definition lives
      # in pom.xml in a separate profile. For MVP 1 this stage is a soft gate
      # — we run the analyzer but only fail on HIGH findings.
      - name: Spotbugs (best-effort, soft-gate)
        working-directory: backend
        run: |
          ./mvnw ${{ env.MAVEN_CLI_OPTS }} -DskipTests compile com.github.spotbugs:spotbugs-maven-plugin:4.8.6.4:check -Dspotbugs.failOnError=false || true

  frontend-sast:
    name: "06 · frontend-sast"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: ESLint
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint

  # ===========================================================================
  # Stage 6 — Backend unit tests (no integration, no @Tag("integration"))
  # ===========================================================================
  backend-unit-test:
    name: "07 · backend-unit-test"
    runs-on: ubuntu-22.04
    needs: [validate]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "Unit tests (excluded: integration)"
        working-directory: backend
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -DexcludedGroups=integration

      - name: Upload Surefire reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-unit
          path: backend/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Stage 7 — Frontend unit tests
  # ===========================================================================
  frontend-unit-test:
    name: "08 · frontend-unit-test"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + test
        working-directory: frontend
        run: |
          # npm install (not ci) so the platform-specific rolldown optional
          # native binding is installed for the runner (npm/cli#4828); vitest 4
          # / vite 8 fail to load it otherwise.
          npm install --no-audit --no-fund
          npm test

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ===========================================================================
  # Stage 7b — Frontend E2E (Playwright, MOCKED / STANDALONE mode)
  #
  # PR-level quality job — runs on the same trigger surface as the other test
  # jobs (push/PR/dispatch), NOT gated behind deploy-staging. With E2E_BASE_URL
  # UNSET, playwright.config.ts spins up its own `webServer`: it builds the app
  # with VITE_USE_MSW=true + VITE_DEV_AUTH=true and serves it via `vite preview`
  # on :4173 — the app self-serves all /api/v1/* via its in-process mock
  # adapter, so NO backend / deploy is required. (For the full-stack run against
  # a live staging target, see "22 · e2e-staging".)
  # ===========================================================================
  frontend-e2e:
    name: "08a · frontend-e2e"
    runs-on: ubuntu-22.04
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        # npm install (not ci) so the platform-specific rolldown optional native
        # binding is installed for the runner (npm/cli#4828); the mocked webServer
        # runs `vite build`, which fails to load it otherwise — mirrors "08".
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (mocked / standalone)
        working-directory: frontend
        # E2E_BASE_URL intentionally UNSET → playwright.config.ts starts its own
        # webServer (build + preview, mock adapter + dev-auth). No backend needed.
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test-results (traces/screenshots)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  # ===========================================================================
  # Stage 7c — BLOCKING: Liquibase migration gate (LiquibaseMigrationTest).
  #
  # Applies the FULL changelog incl. the `seeds` context against a real
  # Testcontainers Postgres. Catches 046-class errors (bad ON CONFLICT clause
  # after a partial-unique-index redesign) at PR time, before images are built.
  #
  # Runs ONLY LiquibaseMigrationTest (-Dgroups=migration) — NOT the full
  # integration suite — to stay fast and honour the team's decision to keep
  # heavy integration tests out of the default PR gate.
  #
  # The test profile (application-test.yml) activates Liquibase contexts
  # `control-plane,seeds,test-roles,mode-shared` — includes `seeds`, so any
  # bad changeset in the seeds context (e.g. 046) is caught here.
  # ===========================================================================
  backend-migration-gate:
    name: "07c · migration-gate [BLOCKING]"
    runs-on: ubuntu-22.04
    needs: [backend-unit-test]
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "Liquibase migration gate (LiquibaseMigrationTest)"
        working-directory: backend
        env:
          GRADING_REQUIRE_DOCKER: "true"
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=migration

      - name: Upload Surefire reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-migration
          path: backend/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Stage 8 — Backend integration tests (Testcontainers). PR-from-fork skipped.
  # ===========================================================================
  backend-integration-test:
    name: "09 · backend-integration-test"
    runs-on: ubuntu-22.04
    needs: [backend-unit-test]
    timeout-minutes: 40
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    services:
      docker:
        image: docker:24-dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Integration tests (all tags)
        working-directory: backend
        env:
          GRADING_REQUIRE_DOCKER: "true"
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=integration

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-integration
          path: backend/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Stage 10 — BLOCKING: tenant-isolation release gate
  # ===========================================================================
  backend-tenant-isolation:
    name: "10 · tenant-isolation [BLOCKING]"
    runs-on: ubuntu-22.04
    needs: [backend-unit-test]
    timeout-minutes: 25
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Tenant-isolation pack
        working-directory: backend
        env:
          GRADING_REQUIRE_DOCKER: "true"
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=tenant-isolation

  # ===========================================================================
  # Stage 11 — BLOCKING: audit release gate
  # ===========================================================================
  backend-audit:
    name: "11 · audit [BLOCKING]"
    runs-on: ubuntu-22.04
    needs: [backend-unit-test]
    timeout-minutes: 25
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Audit pack
        working-directory: backend
        env:
          GRADING_REQUIRE_DOCKER: "true"
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=audit

  # ===========================================================================
  # Stage 12 — BLOCKING: salary release gate
  # ===========================================================================
  backend-salary:
    name: "12 · salary [BLOCKING]"
    runs-on: ubuntu-22.04
    needs: [backend-unit-test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Salary pack
        working-directory: backend
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=salary

  # ===========================================================================
  # Stage 13 — BLOCKING: architecture (ArchUnit) release gate
  # ===========================================================================
  backend-arch:
    name: "13 · architecture [BLOCKING]"
    runs-on: ubuntu-22.04
    needs: [backend-unit-test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: ArchUnit pack
        working-directory: backend
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=architecture

  # ===========================================================================
  # Stage 14 — Build backend image (push only on main / tag)
  # ===========================================================================
  build-backend-image:
    name: "14 · build-backend-image"
    runs-on: ubuntu-22.04
    needs:
      - backend-tenant-isolation
      - backend-audit
      - backend-salary
      - backend-arch
      - backend-migration-gate
      - backend-deps-scan
      - secret-scan
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & maybe push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # ===========================================================================
  # Stage 15 — Build frontend image
  # ===========================================================================
  build-frontend-image:
    name: "15 · build-frontend-image"
    runs-on: ubuntu-22.04
    needs: [frontend-unit-test, frontend-e2e, frontend-deps-scan, frontend-sast, secret-scan]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & maybe push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ===========================================================================
  # Stage 16/17 — Image scans
  # ===========================================================================
  image-scan-backend:
    name: "16 · image-scan-backend"
    runs-on: ubuntu-22.04
    needs: build-backend-image
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Shared version-pinned trivy install (see .github/actions/install-trivy).
      - name: Install trivy
        uses: ./.github/actions/install-trivy
      # Informational, non-blocking image CVE scan.
      - name: Trivy image scan
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output trivy-backend-image.sarif --exit-code 0 \
            ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image.sarif
          category: trivy-backend-image

  image-scan-frontend:
    name: "17 · image-scan-frontend"
    runs-on: ubuntu-22.04
    needs: build-frontend-image
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Shared version-pinned trivy install (see .github/actions/install-trivy).
      - name: Install trivy
        uses: ./.github/actions/install-trivy
      # Informational, non-blocking image CVE scan.
      - name: Trivy image scan
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output trivy-frontend-image.sarif --exit-code 0 \
            ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-image.sarif
          category: trivy-frontend-image

  # ===========================================================================
  # Stage 18 — SBOM generation (Syft for both images)
  # ===========================================================================
  sbom:
    name: "18 · sbom"
    runs-on: ubuntu-22.04
    needs: [build-backend-image, build-frontend-image]
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # syft (anchore/sbom-action) pulls the image from GHCR, which is private —
      # log in first so the docker source can authenticate.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # upload-artifact:false — the action auto-uploads the SBOM as a workflow
      # artifact by default, which fails on the account's hit artifact-storage
      # quota. We only need the SBOM generated (output-file); the optional
      # persisted copy is handled by the continue-on-error upload step below.
      - name: Backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false

      - name: Frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
          retention-days: 90


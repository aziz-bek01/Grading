  # ===========================================================================
  # Stage 22 — E2E (Playwright) FULL-STACK against the deployed staging stack.
  #
  # Same Playwright suite as "08a · frontend-e2e", but driven against a LIVE
  # target via E2E_BASE_URL: playwright.config.ts then skips its webServer and
  # does NOT install the route mocks, so specs exercise the real backend/API
  # end-to-end. Stays guarded (main/tags, needs: deploy-staging) so it remains
  # inert until a real staging deployment exists.
  #
  # REMAINING INFRA PIECE: this needs a reachable full-stack target — either a
  # real staging URL or a per-PR ephemeral stack — exposed to this job. Until
  # `vars.STAGING_BASE_URL` (or an equivalent secret/env) is provisioned, the
  # guard below short-circuits to a notice and the suite does not run, so the
  # placeholder skip behaviour is preserved.
  # ===========================================================================
  e2e-staging:
    name: "22 · e2e-staging"
    runs-on: ubuntu-22.04
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      # When STAGING_BASE_URL is configured (repo/org variable), E2E_BASE_URL is
      # set and the suite runs full-stack. While it is empty, E2E_BASE_URL stays
      # blank and the steps below short-circuit (no-op), keeping this job inert.
      E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Skip notice (no staging target wired yet)
        if: ${{ env.E2E_BASE_URL == '' }}
        run: echo "::notice::Skipping full-stack e2e — set repo variable STAGING_BASE_URL (or an ephemeral stack URL) to enable. Mocked e2e already runs in 08a · frontend-e2e."

      - uses: actions/checkout@v4
        if: ${{ env.E2E_BASE_URL != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.E2E_BASE_URL != '' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        if: ${{ env.E2E_BASE_URL != '' }}
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser (chromium)
        if: ${{ env.E2E_BASE_URL != '' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (full-stack against staging)
        if: ${{ env.E2E_BASE_URL != '' }}
        working-directory: frontend
        # E2E_BASE_URL is SET → playwright.config.ts targets the live URL, skips
        # its webServer, and does NOT install route mocks (real API end-to-end).
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ always() && env.E2E_BASE_URL != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test-results (traces/screenshots)
        if: ${{ failure() && env.E2E_BASE_URL != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-staging
          path: frontend/test-results/
          retention-days: 7


name: deploy

# =============================================================================
# grading.hrlab.uz — self-contained Continuous Deployment to the shared VPS.
# =============================================================================
# On every push to `main` this workflow:
#   1. Builds the backend + frontend images from the repo Dockerfiles.
#   2. Pushes them to GHCR as immutable `sha-<short>` (+ `latest`).
#   3. (only if the VPS secrets exist) SSHes to the VPS, syncs the deploy
#      artifacts, pulls the new images, runs the one-shot Liquibase migrator,
#      then rolls grading-api + grading-frontend. Finally smoke-tests them.
#
# WHY SELF-CONTAINED (not gated on the `ci` workflow):
#   The full `ci` workflow runs the heavy quality matrix (unit/integration/
#   tenant-isolation/audit/salary/arch tests, ESLint, dep+image scans). Those
#   are valuable and keep running for visibility, but gating PRODUCTION deploy
#   on ALL of them means a single flaky lint/scan blocks every release. For a
#   single-node MVP that requires "git push => deploy", the deploy gate is:
#   "do both images BUILD?" (compile + package + docker build). Re-couple to the
#   full test gate once `ci` is green (see TODO in ci.yml quality debt).
#
# SAFE-WHEN-UNCONFIGURED:
#   The deploy job is gated on the VPS_HOST secret. Until you add the VPS
#   secrets the images are still built + pushed to GHCR, and the deploy job is
#   skipped cleanly — nothing touches any server.
#
# GHCR AUTH ON THE VPS:
#   The deploy step logs in to GHCR on the VPS using the ephemeral GITHUB_TOKEN
#   (valid for the duration of the run, packages:read). No long-lived PAT and no
#   "make packages public" step required.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to (re)deploy, e.g. sha-1a2b3c4. Leave empty to build the current commit."
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false        # never interrupt an in-flight production deploy

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Lowercase, fixed image namespace — MUST match GHCR_REPO in /opt/grading/.env.prod
  # (compose pulls ghcr.io/${GHCR_REPO}/grading-api:${IMAGE_TAG}).
  IMAGE_BACKEND: ghcr.io/aziz-bek01/grading/grading-api
  IMAGE_FRONTEND: ghcr.io/aziz-bek01/grading/grading-frontend
  COMPOSE_FILE: docker-compose.prod.yml
  REMOTE_DIR: /opt/grading

jobs:

  # ---------------------------------------------------------------------------
  # Build + push both images to GHCR. Always runs on push to main.
  # ---------------------------------------------------------------------------
  build-images:
    name: build & push images
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On workflow_dispatch with an explicit existing tag we skip building and
      # just (re)deploy that tag. On push we always build the current commit.
      - name: Build & push backend image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:latest
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---------------------------------------------------------------------------
  # Migration gate — apply the FULL Liquibase changelog (including the `seeds`
  # context) against a real Postgres BEFORE any production VPS roll.
  #
  # WHY HERE (not only in ci.yml):
  #   deploy.yml runs independently of ci.yml on every push to main. Putting
  #   the gate here is the only way to guarantee the VPS roll cannot proceed
  #   on a bad migration regardless of whether ci.yml is green.
  #
  # IMPLEMENTATION — reuse LiquibaseMigrationTest (@Tag("migration")):
  #   The existing test boots a full Spring context via Testcontainers against
  #   a real Postgres-16 container. AbstractIntegrationTest activates the
  #   `test` Spring profile, which sets Liquibase contexts to
  #   `control-plane,seeds,test-roles,mode-shared` — a SUPERSET of the
  #   production `control-plane,seeds,mode-shared` set, explicitly including
  #   `seeds`. The full changelog (db.changelog-master.yaml) therefore runs,
  #   including changeset 046-seed-client-ceo-role.yaml (context: seeds).
  #   Any changeset error (like the 046 ON CONFLICT incident) surfaces as a
  #   Spring context initialisation failure → Surefire test failure → this job
  #   fails → `deploy` is blocked before the VPS roll begins.
  #
  # SCOPE — targeted, not the whole integration suite:
  #   -Dgroups=migration runs ONLY LiquibaseMigrationTest (the single class
  #   annotated @Tag("migration")). The broader integration suite (tenant-
  #   isolation, audit, etc.) is deliberately excluded so this gate stays fast
  #   (~3–4 min) and does not reintroduce the quality-debt that motivated
  #   the split in ci.yml.
  # ---------------------------------------------------------------------------
  migrate-gate:
    name: "migrate-gate [BLOCKING]"
    runs-on: ubuntu-22.04
    needs: build-images
    timeout-minutes: 15
    env:
      JAVA_VERSION: "21"
      JAVA_DIST: temurin
      MAVEN_CLI_OPTS: "-B -ntp -e -Dstyle.color=always"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "Liquibase migration gate (LiquibaseMigrationTest)"
        working-directory: backend
        env:
          GRADING_REQUIRE_DOCKER: "true"
        run: ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -Dgroups=migration

      - name: Upload Surefire reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: migrate-gate-surefire-${{ github.sha }}
          path: backend/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate — only deploy when the VPS secrets are configured.
  # ---------------------------------------------------------------------------
  gate:
    name: gate · deploy?
    runs-on: ubuntu-22.04
    needs: [build-images, migrate-gate]
    timeout-minutes: 2
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ]; then
            echo "::notice::VPS_HOST secret is empty — deploy SKIPPED. Images were pushed to GHCR. Add VPS secrets to enable CD."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Deploy — SSH to the VPS, sync artifacts, migrate, roll, smoke-test.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy · production VPS
    runs-on: ubuntu-22.04
    needs: [build-images, gate]
    if: needs.gate.outputs.should_deploy == 'true'
    # Headroom over a realistic ~16-min migrate+roll+smoke on the 2GB box while
    # still bounding a stuck rollout; aligned with the SSH command_timeout (30m).
    timeout-minutes: 30
    environment:
      name: production
      url: https://grading.hrlab.uz
    steps:
      - name: Checkout (deploy artifacts only)
        uses: actions/checkout@v4

      # Copy ONLY what the VPS needs to run the prod stack. Never source code or
      # secrets — secrets live in /opt/grading/.env.prod ON the VPS.
      - name: Copy deploy artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,infra/db/prod/*,infra/frontend/config.json,infra/reverse-proxy/*"
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          strip_components: 0

      - name: Pull, migrate, and roll the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_ACTOR
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ env.REMOTE_DIR }}"

            if [ ! -f .env.prod ]; then
              echo "FATAL: .env.prod missing on VPS. Run first-time setup (see runbook)." >&2
              exit 1
            fi
            # Pin the immutable tag CI just built (leave the rest of .env.prod intact).
            if grep -q '^IMAGE_TAG=' .env.prod; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.prod
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env.prod
            fi

            # Authenticate to GHCR with the ephemeral run token (packages:read).
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

            COMPOSE="docker compose -f ${{ env.COMPOSE_FILE }} --env-file .env.prod"

            echo '== Pulling immutable images =='
            $COMPOSE --profile db --profile migrate pull

            echo '== Ensuring the dedicated grading Postgres is up (bundled-DB mode) =='
            if grep -q '^GRADING_USE_EXTERNAL_DB=false' .env.prod; then
              $COMPOSE --profile db up -d grading-postgres
              # Wait for the DB to be healthy before migrating.
              for i in $(seq 1 30); do
                s=$(docker inspect -f '{{.State.Health.Status}}' grading-postgres-prod 2>/dev/null || echo none)
                [ "$s" = "healthy" ] && break
                sleep 3
              done
            fi

            echo '== Running Liquibase migrator (grading_migrator, one-shot) =='
            # Non-zero exit here fails the deploy; the running api/frontend keep
            # serving the previous version.
            $COMPOSE --profile migrate run --rm grading-migrator

            # OPT-IN object storage. ONLY when the operator set
            # GRADING_STORAGE_TYPE=minio in .env.prod do we start the MinIO
            # service (health-gated) BEFORE rolling the api so the api comes up
            # with a ready backend. When NOT enabled, this whole block is skipped
            # and the roll is EXACTLY as before (default path = local-FS).
            if grep -Eq '^[[:space:]]*GRADING_STORAGE_TYPE[[:space:]]*=[[:space:]]*minio([[:space:]]|$)' .env.prod; then
              echo '== Object storage ENABLED (GRADING_STORAGE_TYPE=minio) — bringing up grading-minio =='
              $COMPOSE --profile storage up -d grading-minio
              # Wait for MinIO to report healthy before rolling the api (same
              # retry/timeout cadence as the Postgres readiness gate above).
              for i in $(seq 1 30); do
                s=$(docker inspect -f '{{.State.Health.Status}}' grading-minio-prod 2>/dev/null || echo none)
                echo "minio health: $s ($i/30)"
                [ "$s" = "healthy" ] && break
                sleep 3
              done
              if [ "$(docker inspect -f '{{.State.Health.Status}}' grading-minio-prod 2>/dev/null || echo none)" != "healthy" ]; then
                echo "FATAL: grading-minio did not become healthy — aborting roll (api keeps serving previous version)." >&2
                exit 1
              fi
            else
              echo '== Object storage DISABLED (default local-FS) — grading-minio NOT started =='
            fi

            echo '== Rolling api + frontend to the new immutable tag =='
            $COMPOSE up -d grading-api grading-frontend

            docker logout ghcr.io >/dev/null 2>&1 || true
            echo '== Pruning unused images (incl. old sha tags) to keep disk bounded =='
            docker image prune -af --filter "until=24h" >/dev/null 2>&1 || true
            echo "Deployed IMAGE_TAG=${IMAGE_TAG}"

      - name: Post-deploy smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo '== Wait for the API container healthcheck (JVM cold start) =='
            # The container's own healthcheck is the reliable readiness signal —
            # poll it before curling so we never race the JVM warm-up. (curl
            # alone can hit "connection reset by peer" mid-startup, which
            # --retry-connrefused does NOT retry.)
            for i in $(seq 1 36); do
              s=$(docker inspect -f '{{.State.Health.Status}}' grading-api-prod 2>/dev/null || echo none)
              echo "api health: $s ($i/36)"
              [ "$s" = "healthy" ] && break
              sleep 5
            done
            echo '== API readiness =='
            curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
              http://127.0.0.1:18080/actuator/health/readiness
            echo
            echo '== Frontend health =='
            curl -fsS --retry 6 --retry-delay 3 --retry-all-errors \
              http://127.0.0.1:18081/healthz
            echo
            echo '== Public same-origin + edge-cache freshness (detailed) =='
            # Source of truth = what the freshly-rolled container serves on
            # 127.0.0.1:18081. The public URL goes through the host nginx and
            # whatever fronts grading.hrlab.uz. If any layer caches index.html it
            # pins OLD bundle hashes and users keep the previous build even though
            # the roll succeeded. We dump bundle hashes AND response headers for
            # the container vs the public edge, on the entry + the deep route a
            # real CEO actually loads, so "deployed but not visible" is explicit.
            echo "-- grading.hrlab.uz resolves (from VPS) to:"
            getent hosts grading.hrlab.uz || echo "(getent failed)"

            hash_of() { curl -fsS "$1" 2>/dev/null | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n1 || true; }
            hdrs_of() {
              echo "  ---- [$1] $2"
              curl -sS -D - -o /dev/null "$2" 2>/dev/null \
                | grep -iE '^(HTTP/|cache-control|pragma|age|via|x-cache|x-cache-status|cf-cache-status|cf-ray|server|expires|etag|last-modified):' \
                | sed 's/^/      /' || echo "      (no response / blocked)"
            }

            ORIGIN_HASH="$(hash_of http://127.0.0.1:18081/)"
            PUBLIC_HASH="$(hash_of https://grading.hrlab.uz/)"
            PUBLIC_DEEP_HASH="$(hash_of https://grading.hrlab.uz/app/ceo/panels)"
            echo "origin (container) /            bundle: ${ORIGIN_HASH:-<none>}"
            echo "public (edge)      /            bundle: ${PUBLIC_HASH:-<none>}"
            echo "public (edge)      /app/ceo/...  bundle: ${PUBLIC_DEEP_HASH:-<none>}"

            echo "-- Response headers (entry HTML MUST be no-store; watch for age/via/x-cache):"
            hdrs_of "container /"             http://127.0.0.1:18081/
            hdrs_of "container /index.html"   http://127.0.0.1:18081/index.html
            hdrs_of "public /"                https://grading.hrlab.uz/
            hdrs_of "public /index.html"      https://grading.hrlab.uz/index.html
            hdrs_of "public /app/ceo/panels"  https://grading.hrlab.uz/app/ceo/panels

            if [ -z "$PUBLIC_HASH$PUBLIC_DEEP_HASH" ]; then
              echo '::warning::Public check failed — verify outer proxy + TLS + DNS.'
            elif [ -n "$ORIGIN_HASH" ] && [ "$ORIGIN_HASH" = "$PUBLIC_HASH" ]; then
              echo "public OK — edge serves the freshly-deployed bundle"
            else
              echo "::warning::STALE EDGE CACHE — public ($PUBLIC_HASH) != origin ($ORIGIN_HASH). A layer fronting grading.hrlab.uz is serving a cached index.html, so users keep the old build. Purge it and ensure index.html is served no-store."
            fi

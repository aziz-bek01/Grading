# Dev profile — the canonical alias used by CI smoke jobs and the Maven `dev`
# profile (`./mvnw clean verify -Pdev`). Unlike `local`, this profile models a
# DEPLOYED runtime (dev/demo VPS), so it MUST exercise the same tenant-isolation
# posture as prod.
#
# DATASOURCE ROLE (BE-1, RLS gap closure — 2026-06-12):
#   The runtime connects as `grading_runtime`, a NON-superuser, NON-BYPASSRLS
#   role that is SUBJECT to FORCE ROW LEVEL SECURITY. The previous credential
#   (`grading_app`, the bootstrap superuser) silently BYPASSED RLS, so a missing
#   app.tenant_id GUC or a forgotten tenant predicate would NOT be caught at the
#   DB layer — the exact gap behind the approvals cross-tenant inbox leak.
#   `grading_runtime` LOGIN + dev password are provisioned by the `test-roles`
#   Liquibase context (already included below); Liquibase migrations still run
#   under the bootstrap superuser via the migration job, NOT this runtime role.
#   A boot-time guard (DatasourceRolePrivilegeGuard) FAILS STARTUP if this
#   runtime role ever turns out to be superuser/bypassrls in a non-local profile.
#
# PRODUCTION SAFETY:
#   - This file is NEVER active in production. Production deployments must
#     set SPRING_PROFILES_ACTIVE to a non-dev value (e.g. `prod`) AND must
#     omit the `dev` Liquibase context (the base application.yml already
#     does — see `spring.liquibase.contexts`).
#   - DevAuthFilter binds whenever the `dev` profile is active. NEVER
#     activate this profile in any deployed environment.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/grading_control_db
    username: grading_runtime
    password: grading_runtime_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: public
  liquibase:
    default-schema: public
    contexts: control-plane,seeds,test-roles,mode-shared,dev

logging:
  level:
    root: INFO
    uz.hrlab.grading: DEBUG
    security.audit: INFO

grading:
  security:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:5174

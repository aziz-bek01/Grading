# Test profile — datasource URL is supplied by Testcontainers via
# Spring's @ServiceConnection / DynamicPropertySource in the test base class.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  liquibase:
    enabled: true
    default-schema: public
    # `test-roles` enables LOGIN + dev passwords on the grading_migrator /
    # grading_runtime / grading_audit_reader roles so AuditRoleGrantsTest
    # can connect as them. NEVER enable this context in production.
    contexts: control-plane,seeds,test-roles,mode-shared

logging:
  level:
    root: WARN
    uz.hrlab.grading: INFO
    liquibase: WARN

# Test CORS allowlist — used by CorsAllowlistIntegrationTest.
grading:
  security:
    cors:
      allowed-origins: http://localhost:5173,https://test.grading.hrlab.uz
  # Batch-4: push the @Scheduled worker re-queuer's first fire far out so it never
  # auto-runs during the test context lifetime. Tests invoke WorkerRetryScanner /
  # WorkerReQueuer directly instead of waiting on the timer.
  worker:
    requeue:
      initial-delay-ms: 86400000   # 24h
      fixed-delay-ms: 86400000

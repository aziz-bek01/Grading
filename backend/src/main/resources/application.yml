# grading.hrlab.uz — base application config.
# Profile-specific overrides live in application-{profile}.yml.
#
# DATABASE USER (see db/role-grants-matrix.md — F-04 remediation):
#   In every NON-LOCAL environment (dev, staging, prod) the runtime
#   `spring.datasource.username` MUST be `grading_runtime`. That role has
#   SELECT/INSERT/UPDATE/DELETE on business tables, but only SELECT+INSERT
#   on `public.system_audit_log` and `public.tenant_audit_logs` — UPDATE,
#   DELETE and TRUNCATE are revoked at the DB grant layer.
#   Liquibase migrations run under `grading_migrator`; never reuse the
#   runtime credential for migrations. devops-sre owns the three Vault
#   secrets (one per role) per environment.
#   Local dev (application-local.yml) may keep a single superuser as a
#   convenience but this is explicitly flagged there.
spring:
  application:
    name: grading
  profiles:
    default: local
  datasource:
    # PERF (P1) — explicit HikariCP sizing. max pool 20 keeps headroom under the
    # Postgres max_connections=40 (room for migrations/admin sessions and a
    # second app instance). leak-detection logs any connection held > 30s so a
    # missing tx boundary surfaces in logs rather than silently exhausting the
    # pool. Safe for all profiles; tests override datasource URL, not pool knobs.
    hikari:
      # Overridable per environment so a multi-replica deployment can stay within
      # the Postgres max_connections budget (sum of all replicas + migrator + admin).
      maximum-pool-size: ${GRADING_DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # PERF (P1) — batch JDBC writes; order so same-table statements group
          # into a single batch (cuts round-trips on bulk import/save paths).
          batch_size: 32
        # PERF (P1) — eager batch-fetch of lazy associations/collections in
        # blocks of 16 (mitigates N+1 on traversal without forcing fetch joins).
        default_batch_fetch_size: 16
        order_inserts: true
        order_updates: true
        format_sql: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: control-plane,seeds,mode-shared
  jackson:
    # Global JSON contract (Contract-A): snake_case property names so the
    # frontend consumes a single consistent casing (name_i18n, total_elements,
    # raw_total_score...). Map KEYS (e.g. LocalizedString "ru-RU") are NOT
    # affected — the naming strategy only rewrites POJO field names.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  # PERF (P1) — gzip JSON/text responses over 1 KiB. Grid/report/list payloads
  # are large JSON; compression cuts wire bytes with negligible CPU. Small
  # responses are left uncompressed (min-response-size) to avoid overhead.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,text/html,application/javascript
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # health + info are PUBLIC (allowlisted in SecurityConfig.PUBLIC_PATHS).
        # prometheus + metrics are EXPOSED on the management surface but are NOT
        # public — they fall through to `.anyRequest().authenticated()` in
        # SecurityConfig because the allowlist matches only `/actuator/health/**`
        # and `/actuator/info`, never `/actuator/**`. Exposing here just makes
        # the endpoint *reachable* by an authenticated/internal scraper; it does
        # NOT relax authentication. Metrics can leak tenant counts / operational
        # data, hence they must stay authenticated (Batch 6 security note).
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        # liveness/readiness groups so the public /actuator/health/{liveness,
        # readiness} probes (used by the Helm chart) keep working without
        # exposing component detail.
        enabled: true
  # Common tags applied to every meter. tenant/user/project are DELIBERATELY
  # absent — high-cardinality + identifying values must never become metric
  # tags (tenant-isolation + salary [BLOCKING] gates). Only the static
  # application name is attached here.
  metrics:
    tags:
      application: grading
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# OAuth2 resource-server config is profile-specific (production sets issuer-uri).
# spring.security.oauth2.resourceserver.jwt.audience — comma-separated list of
# accepted aud claim values. Defaults to grading.hrlab.uz in SecurityConfig if
# unset, but production deployments should set this explicitly via env var
# GRADING_JWT_AUDIENCE.

# grading-specific knobs
grading:
  storage:
    # Object-storage backend selector. Default stays LOCAL so dev/test/CI and the
    # one-shot `migrate` profile never need a MinIO endpoint. Production sets
    # GRADING_STORAGE_TYPE=minio (devops-sre owns the env + bucket/KMS/lifecycle).
    type: ${GRADING_STORAGE_TYPE:local}
    minio:
      # Kebab-case keys so Spring relaxed binding maps the env vars below.
      # These are LOCAL/DEV defaults only — production secrets come from the
      # environment (Vault-sourced), never from this file.
      endpoint: ${GRADING_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${GRADING_STORAGE_MINIO_ACCESS_KEY:grading_minio}
      secret-key: ${GRADING_STORAGE_MINIO_SECRET_KEY:grading_minio_pwd}
      bucket: ${GRADING_STORAGE_MINIO_BUCKET:grading}
      region: ${GRADING_STORAGE_MINIO_REGION:us-east-1}
  tenancy:
    # MVP 1 default: shared schema (tenant_id column scopes rows). Production
    # target is schema-per-tenant (see TenantSchemaProvisioner + database-
    # blueprint §10). Override via env var GRADING_TENANCY_MODE=schema_per_tenant.
    mode: ${GRADING_TENANCY_MODE:shared}
  security:
    cors:
      # Comma-separated allowlist of CORS origins. Production MUST set this via
      # env var GRADING_CORS_ALLOWED_ORIGINS (e.g. "https://grading.hrlab.uz").
      # Empty list = browsers cannot make cross-origin requests (fail-closed).
      allowed-origins: ${GRADING_CORS_ALLOWED_ORIGINS:}
    salary-encryption:
      # Stub key id/version for SalaryEncryptionConverter (MVP 3 ships real KMS).
      key-id: ${GRADING_SALARY_KEY_ID:dev-stub}
      key-version: ${GRADING_SALARY_KEY_VERSION:1}
      # When true, a '-stub' key in a deployed profile HARD-FAILS salary writes.
      # Default false: log a loud warning but keep writing (don't break a
      # deployment still on the placeholder key). Set true once a real KMS key
      # is provisioned to enforce the fail-closed guard.
      fail-on-stub-key: ${GRADING_SALARY_FAIL_ON_STUB_KEY:false}
  idp:
    # IdP provisioning (decision doc 08, Option A — admin-set-password, NO SMTP).
    # FEATURE-FLAGGED: disabled by default so local/test/CI keep DB-only invites
    # (no IdP, no network). Production turns it on via env vars sourced from the
    # VPS .env.prod secret file (see docker-compose.prod.yml). The token is a
    # high-value platform secret — NEVER committed, NEVER logged. Only ${VAR}
    # placeholders appear here; the real values live only in the environment.
    zitadel:
      enabled:  ${GRADING_IDP_ZITADEL_ENABLED:false}
      api-base: ${GRADING_IDP_ZITADEL_API_BASE:}
      org-id:   ${GRADING_IDP_ZITADEL_ORG_ID:}
      token:    ${GRADING_IDP_ZITADEL_TOKEN:}

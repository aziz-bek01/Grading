# Master Liquibase changelog router (database-blueprint §9.1).
# Contexts:
#   control-plane — shared `public` schema changesets (MVP 1 baseline)
#   tenant-schema — per-tenant schema template (Phase 2+ — not loaded in MVP 1 boot)
#   seeds         — reference data (permissions, roles, locales)
#   rls-enable    — RLS policy ENABLE statements (MVP 2)
#   test-data     — only loaded by integration tests
databaseChangeLog:
  - include:
      file: control-plane/001-create-tenants.yaml
      relativeToChangelogFile: true
  - include:
      file: control-plane/002-create-users-access.yaml
      relativeToChangelogFile: true
  - include:
      file: control-plane/003-create-system-audit.yaml
      relativeToChangelogFile: true
  - include:
      file: control-plane/004-create-localization.yaml
      relativeToChangelogFile: true
  - include:
      file: control-plane/005-db-role-grants.yaml
      relativeToChangelogFile: true
  - include:
      file: control-plane/006-audit-logs-partitioning.yaml
      relativeToChangelogFile: true
  # E4-S0 — per-tenant user→department scope (ABAC). Depends only on
  # control-plane users + tenants (001/002); no tenant-schema dependency.
  - include:
      file: control-plane/007-create-user-department-scopes.yaml
      relativeToChangelogFile: true
  # E3 — custom (tenant-defined) roles. ALTERs public.roles (from 002) and FKs
  # public.tenants (from 001); must run AFTER 001/002 and BEFORE the role seed
  # (seeds/002) so the 11 seeded rows inherit is_system=true / tenant_id=NULL.
  - include:
      file: control-plane/008-roles-custom-tenant.yaml
      relativeToChangelogFile: true
  - include:
      file: seeds/001-default-permissions.yaml
      relativeToChangelogFile: true
  - include:
      file: seeds/002-default-roles.yaml
      relativeToChangelogFile: true
  - include:
      file: seeds/003-default-locales.yaml
      relativeToChangelogFile: true
  - include:
      file: seeds/004-default-role-permissions.yaml
      relativeToChangelogFile: true
  # Phase 2 — tenant-schema tables.
  # In `mode-shared` (default for local dev + integration tests) these are
  # created in the `public` schema; in production they will be re-applied
  # per tenant by TenantSchemaProvisioner using db.changelog-tenant.yaml.
  - include:
      file: tenant-schema/db.changelog-tenant.yaml
      relativeToChangelogFile: true

  # BE-1 — METHODOLOGY_EDIT_APPROVED catalogue code + super-admin-only grant +
  # invariant. Registered BEFORE seeds/005 so the super-admin backfill below
  # ALSO picks the new non-carve-out code up automatically (existing super admins
  # get it), and so seeds/005's positive-assertion invariant still holds.
  - include:
      file: seeds/006-methodology-edit-approved-permission.yaml
      relativeToChangelogFile: true

  # P2-FIX (Task 1) — CLIENT_* catalogue codes + grants (CLIENT_COMPANY_ADMIN
  # can edit its own client profile; HRLAB_PROJECT_MANAGER read-only oversight).
  # Registered BEFORE seeds/005 so the super-admin wildcard-minus-carve-outs
  # backfill ALSO picks the three new non-carve-out codes up automatically, and
  # so seeds/005's positive-assertion invariant (super admin holds every
  # non-carve-out code) still holds.
  - include:
      file: seeds/007-client-company-permissions.yaml
      relativeToChangelogFile: true

  # Corrective, forward-only HRLAB_SUPER_ADMIN permission backfill (hotfix:
  # "super adminga hamma narsa berkilib qolibdi"). MUST run AFTER seeds/004 AND
  # after the tenant-schema bundle above, because that bundle inserts the newer
  # MVP1/MVP2 permission CATALOGUE rows (007/013/016/019/023/027/038) into
  # public.permissions in mode-shared. Running last guarantees every catalogue
  # code exists when the wildcard-minus-carve-outs grant for HRLAB_SUPER_ADMIN
  # runs, and lets the changeset's own post-condition invariant assert that the
  # super admin holds every non-carve-out code. Idempotent (ON CONFLICT DO
  # NOTHING); only touches public.role_permissions for HRLAB_SUPER_ADMIN.
  - include:
      file: seeds/005-superadmin-permission-backfill.yaml
      relativeToChangelogFile: true

  # ------------------------------------------------------------------------
  # Dev-only seed (BE-SEED-003). EVERY changeset inside this file declares
  # `context: dev`. Production application.yml contexts list does NOT include
  # `dev`, so Liquibase refuses to apply these rows in production even if
  # the file is on the classpath.
  # ------------------------------------------------------------------------
  - include:
      file: seeds-dev/001-dev-seed-tenants.yaml
      relativeToChangelogFile: true
      context: dev
  # Dev-only methodology + organization + positions + evaluations seed.
  # Codes match frontend MSW fixtures so the real API and the mock layer
  # surface identical demo data (BE-SEED-004).
  - include:
      file: seeds-dev/002-dev-seed-methodology.yaml
      relativeToChangelogFile: true
      context: dev

# =========================================================================
# DEV-ONLY SEED — never runs outside the `dev` (or `local`) Liquibase context.
# =========================================================================
#
# Purpose (BE-SEED-003): give local developers + integration smoke tests two
# realistic tenants (ACME Holdings, Beta University) so the frontend tenant
# switcher, the projects list, and cross-tenant isolation tests have real
# rows to operate on. Without this seed the `public.tenants` and
# `public.client_companies` tables are empty after a clean Liquibase run.
#
# PRODUCTION SAFETY:
#   1. Every changeSet declares `context: dev` — Liquibase will only apply
#      these rows when the active context list contains `dev`.
#   2. `application.yml` defaults to contexts `control-plane,seeds,mode-shared`
#      — `dev` is NOT in that list. Production therefore CANNOT receive this
#      seed even by accident.
#   3. `application-local.yml` already runs `test-roles,mode-shared,...`; the
#      master changelog will include this file under `dev` so local picks it
#      up via the explicit `application-dev.yml` profile (added separately).
#   4. The bundled "admin" users have NO password — the platform is
#      JWT-based; local dev authenticates through the {@code DevAuthFilter}
#      using `X-Dev-User: <uuid>` headers. There are NO bcrypt secrets to
#      leak.
#   5. UUIDs are hardcoded so frontend devAuth.ts can pin them in sync and
#      tests get deterministic ids. Should the frontend ever rotate the
#      values, both sides must be updated together.
#
# Frontend cross-reference:
#   frontend/src/features/auth/devAuth.ts — tenant cards currently use the
#   placeholder strings `tenant-acme` / `tenant-beta`. After this seed
#   ships, devAuth.ts MUST be updated to use the real UUIDs below
#   (00000000-0000-0000-0000-0000000ACME0 / -0000000BETA0).

databaseChangeLog:

  # -----------------------------------------------------------------------
  # 1) Two tenants
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-001-tenants
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT count(*) FROM public.tenants WHERE slug IN ('acme', 'beta')
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO public.tenants
                (id, slug, display_name, isolation_mode, schema_name, database_name,
                 status, default_locale, version)
              VALUES
                ('11111111-1111-1111-1111-111111111111',
                 'acme',
                 'ACME Holdings',
                 'SCHEMA',
                 'tenant_acme',
                 NULL,
                 'ACTIVE',
                 'ru-RU',
                 0),
                ('22222222-2222-2222-2222-222222222222',
                 'beta',
                 'Beta University',
                 'SCHEMA',
                 'tenant_beta',
                 NULL,
                 'ACTIVE',
                 'uz-Latn-UZ',
                 0);
      rollback:
        - sql:
            sql: |
              DELETE FROM public.tenants
              WHERE id IN ('11111111-1111-1111-1111-111111111111',
                           '22222222-2222-2222-2222-222222222222');

  # -----------------------------------------------------------------------
  # 2) One client_company per tenant (UNIQUE(tenant_id) — F-203 + §5.1)
  # -----------------------------------------------------------------------
  - changeSet:

      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM public.client_companies
              WHERE tenant_id IN (
                '11111111-1111-1111-1111-111111111111',
                '22222222-2222-2222-2222-222222222222'
              )
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO public.client_companies
                (id, tenant_id, legal_name, brand_name, industry, country_code,
                 tax_id, version)
              VALUES
                ('11111111-1111-1111-1111-1111111111c1',
                 '11111111-1111-1111-1111-111111111111',
                 'ACME Holdings LLC',
                 'ACME',
                 'Diversified Holding',
                 'UZ',
                 '300000001',
                 0),
                ('22222222-2222-2222-2222-2222222222c2',
                 '22222222-2222-2222-2222-222222222222',
                 'Beta University',
                 'BetaU',
                 'Higher Education',
                 'UZ',
                 '300000002',
                 0);
      rollback:
        - sql:
            sql: |
              DELETE FROM public.client_companies
              WHERE id IN ('11111111-1111-1111-1111-1111111111c1',
                           '22222222-2222-2222-2222-2222222222c2');

  # -----------------------------------------------------------------------
  # 3) One default super-admin user per tenant.
  #
  #    NOTE: this platform is JWT-based — `public.users` has NO password
  #    column. Devs authenticate locally via `X-Dev-User: <uuid>` headers
  #    (see DevAuthFilter). The "credentials" are simply the UUID below.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-003-users
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM public.users
              WHERE LOWER(email) IN ('admin@acme.dev', 'admin@beta.dev')
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO public.users
                (id, email, external_idp_subject, full_name, status,
                 default_locale, version)
              VALUES
                ('aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                 'admin@acme.dev',
                 'dev|admin@acme.dev',
                 'ACME Admin',
                 'ACTIVE',
                 'ru-RU',
                 0),
                ('bbbb2222-bbbb-2222-bbbb-2222bbbb2222',
                 'admin@beta.dev',
                 'dev|admin@beta.dev',
                 'Beta Admin',
                 'ACTIVE',
                 'uz-Latn-UZ',
                 0);
      rollback:
        - sql:
            sql: |
              DELETE FROM public.users
              WHERE id IN ('aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                           'bbbb2222-bbbb-2222-bbbb-2222bbbb2222');

  # -----------------------------------------------------------------------
  # 4) Memberships — each CLIENT admin → own tenant only (default-deny
  #    boundary). The HRLab PLATFORM super-admin gets an extra cross-tenant
  #    membership in changeset 5b below.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-004-memberships
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM public.user_tenant_memberships
              WHERE user_id IN (
                'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                'bbbb2222-bbbb-2222-bbbb-2222bbbb2222'
              )
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO public.user_tenant_memberships
                (id, user_id, tenant_id, status, salary_data_permission, version)
              VALUES
                ('aaaa1111-aaaa-1111-aaaa-1111aaaa2222',
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                 '11111111-1111-1111-1111-111111111111',
                 'ACTIVE',
                 false,
                 0),
                ('bbbb2222-bbbb-2222-bbbb-2222bbbb3333',
                 'bbbb2222-bbbb-2222-bbbb-2222bbbb2222',
                 '22222222-2222-2222-2222-222222222222',
                 'ACTIVE',
                 false,
                 0);
      rollback:
        - sql:
            sql: |
              DELETE FROM public.user_tenant_memberships
              WHERE id IN ('aaaa1111-aaaa-1111-aaaa-1111aaaa2222',
                           'bbbb2222-bbbb-2222-bbbb-2222bbbb3333');

  # -----------------------------------------------------------------------
  # 5) Role assignment — HRLAB_SUPER_ADMIN on both memberships.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-005-user-roles
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM public.user_roles
              WHERE user_tenant_membership_id IN (
                'aaaa1111-aaaa-1111-aaaa-1111aaaa2222',
                'bbbb2222-bbbb-2222-bbbb-2222bbbb3333'
              )
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO public.user_roles
                (id, user_tenant_membership_id, role_id)
              SELECT gen_random_uuid(),
                     'aaaa1111-aaaa-1111-aaaa-1111aaaa2222',
                     r.id
              FROM public.roles r WHERE r.code = 'HRLAB_SUPER_ADMIN';

              INSERT INTO public.user_roles
                (id, user_tenant_membership_id, role_id)
              SELECT gen_random_uuid(),
                     'bbbb2222-bbbb-2222-bbbb-2222bbbb3333',
                     r.id
              FROM public.roles r WHERE r.code = 'HRLAB_SUPER_ADMIN';
      rollback:
        - sql:
            sql: |
              DELETE FROM public.user_roles
              WHERE user_tenant_membership_id IN (
                'aaaa1111-aaaa-1111-aaaa-1111aaaa2222',
                'bbbb2222-bbbb-2222-bbbb-2222bbbb3333'
              );

  # -----------------------------------------------------------------------
  # 5b) Cross-tenant access for the HRLab PLATFORM super-admin.
  #
  #     `aaaa1111…` holds the PLATFORM-scoped role HRLAB_SUPER_ADMIN — an
  #     HRLab consultant who manages the whole client portfolio. Unlike a
  #     CLIENT_COMPANY_ADMIN (single-tenant), this user must be a member of
  #     EVERY client company so the TopBar company switcher works without a
  #     403. The dev resolver (DevUserAuthorityResolver) mirrors production:
  #     the IdP only mints a per-tenant JWT when a matching ACTIVE membership
  #     exists. This adds the same HRLAB_SUPER_ADMIN grant on Beta University
  #     so switching companies in the UI resolves real permissions instead
  #     of an empty (fail-closed) authority set.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-005b-superadmin-beta-membership
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM public.user_tenant_memberships
              WHERE id = 'aaaa1111-aaaa-1111-aaaa-1111bbbb2222'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO public.user_tenant_memberships
                (id, user_id, tenant_id, status, salary_data_permission, version)
              VALUES
                ('aaaa1111-aaaa-1111-aaaa-1111bbbb2222',
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                 '22222222-2222-2222-2222-222222222222',
                 'ACTIVE',
                 false,
                 0);

              INSERT INTO public.user_roles
                (id, user_tenant_membership_id, role_id)
              SELECT gen_random_uuid(),
                     'aaaa1111-aaaa-1111-aaaa-1111bbbb2222',
                     r.id
              FROM public.roles r WHERE r.code = 'HRLAB_SUPER_ADMIN';
      rollback:
        - sql:
            sql: |
              DELETE FROM public.user_roles
              WHERE user_tenant_membership_id = 'aaaa1111-aaaa-1111-aaaa-1111bbbb2222';
              DELETE FROM public.user_tenant_memberships
              WHERE id = 'aaaa1111-aaaa-1111-aaaa-1111bbbb2222';


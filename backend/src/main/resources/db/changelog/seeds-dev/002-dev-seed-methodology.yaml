            stripComments: true
            sql: |
              INSERT INTO factors
                (id, tenant_id, methodology_version_id, code, name_i18n,
                 weight, max_points, sort_order, required, version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-aaaaffff0001','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','KNOWLEDGE',
                 '{"ru-RU":"Знания","uz-Cyrl-UZ":"Билим","uz-Latn-UZ":"Bilim","en-US":"Knowledge"}'::jsonb,15,100,0,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0002','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','EXPERIENCE',
                 '{"ru-RU":"Опыт","uz-Cyrl-UZ":"Тажриба","uz-Latn-UZ":"Tajriba","en-US":"Experience"}'::jsonb,12,100,1,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0003','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','COMPLEXITY',
                 '{"ru-RU":"Сложность","uz-Cyrl-UZ":"Мураккаблик","uz-Latn-UZ":"Murakkablik","en-US":"Complexity"}'::jsonb,14,100,2,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0004','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','RESPONSIBILITY',
                 '{"ru-RU":"Ответственность","uz-Cyrl-UZ":"Жавобгарлик","uz-Latn-UZ":"Javobgarlik","en-US":"Responsibility"}'::jsonb,15,100,3,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0005','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','AUTONOMY',
                 '{"ru-RU":"Автономия","uz-Cyrl-UZ":"Мустақиллик","uz-Latn-UZ":"Mustaqillik","en-US":"Autonomy"}'::jsonb,10,100,4,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0006','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','INFLUENCE',
                 '{"ru-RU":"Влияние","uz-Cyrl-UZ":"Таъсир","uz-Latn-UZ":"Ta''sir","en-US":"Influence"}'::jsonb,12,100,5,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0007','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','COMMUNICATION',
                 '{"ru-RU":"Коммуникация","uz-Cyrl-UZ":"Мулоқот","uz-Latn-UZ":"Muloqot","en-US":"Communication"}'::jsonb,10,100,6,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-aaaaffff0008','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-aaaaaaaa0002','WORKING_CONDITIONS',
                 '{"ru-RU":"Условия труда","uz-Cyrl-UZ":"Меҳнат шароити","uz-Latn-UZ":"Mehnat sharoiti","en-US":"Working conditions"}'::jsonb,12,100,7,true,0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');
      rollback:
        - sql:
            sql: |
              DELETE FROM factors WHERE methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';

  # -----------------------------------------------------------------------
  # 3) 5 levels per factor (A..E, level_order 1..5, points 10/25/50/75/100)
  #    NOTE: DB CHECK requires level_order >= 1, so we use 1-based order
  #    (frontend mock uses 0-based but renders the same A..E codes).
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-003-factor-levels
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM factor_levels
              WHERE factor_id = '11111111-aaaa-1111-aaaa-aaaaffff0001'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- Generate A..E (level_order 1..5) for every factor of the CFO-FIN
              -- DRAFT version. Points 10/25/50/75/100; scale_value 0.2..1.0.
              -- Level ids are random (gen_random_uuid) — evaluation_scores below
              -- resolves the right level by JOIN on (factor_id, level_order=4),
              -- so deterministic level ids are not required.
              INSERT INTO factor_levels
                (id, tenant_id, factor_id, code, level_order, points, scale_value,
                 label_i18n, version, created_by)
              SELECT
                gen_random_uuid(),
                f.tenant_id,
                f.id,
                lvl.code,
                lvl.level_order,
                lvl.points,
                lvl.scale_value,
                lvl.label_i18n::jsonb,
                0,
                'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
              FROM factors f
              CROSS JOIN (
                VALUES
                  ('A',1,10,0.2,  '{"ru-RU":"Базовый","uz-Cyrl-UZ":"Бошланғич","uz-Latn-UZ":"Boshlang''ich","en-US":"Basic"}'),
                  ('B',2,25,0.4,  '{"ru-RU":"Начальный","uz-Cyrl-UZ":"Бошланувчи","uz-Latn-UZ":"Boshlanuvchi","en-US":"Beginning"}'),
                  ('C',3,50,0.6,  '{"ru-RU":"Средний","uz-Cyrl-UZ":"Ўрта","uz-Latn-UZ":"O''rta","en-US":"Intermediate"}'),
                  ('D',4,75,0.8,  '{"ru-RU":"Продвинутый","uz-Cyrl-UZ":"Илғор","uz-Latn-UZ":"Ilg''or","en-US":"Advanced"}'),
                  ('E',5,100,1.0, '{"ru-RU":"Экспертный","uz-Cyrl-UZ":"Эксперт","uz-Latn-UZ":"Ekspert","en-US":"Expert"}')
              ) AS lvl(code, level_order, points, scale_value, label_i18n)
              WHERE f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';
      rollback:
        - sql:
            sql: |
              DELETE FROM factor_levels fl
              USING factors f
              WHERE fl.factor_id = f.id
                AND f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';

  # -----------------------------------------------------------------------
  # 4) Promote the version DRAFT -> APPROVED (now factors/levels exist).
  #    The mv-status-regression trigger permits DRAFT -> APPROVED.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-004-approve-version
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM methodology_versions
              WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002' AND status = 'DRAFT'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE methodology_versions
                 SET status = 'APPROVED',
                     approved_at = now(),
                     approved_by = 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                     updated_at = now(),
                     updated_by = 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
               WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';
      rollback:
        - sql:
            sql: |
              -- Cannot regress APPROVED -> DRAFT (trigger). Rollback is a no-op;
              -- the parent changeSet rollback drops the row entirely.
              SELECT 1;

  # -----------------------------------------------------------------------
  # 5) Organization — 4 departments for the ACME-GRADE-2026 project.
  #    HQ (BRANCH) -> FIN (DEPARTMENT) -> FIN-TR (UNIT); HQ -> IT (DIVISION).
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-005-departments
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase2
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM departments
              WHERE project_id = '11111111-aaaa-1111-aaaa-111111110001'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO departments
                (id, tenant_id, project_id, parent_id, code, name_i18n, type, status, version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-dddddddd0001','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001',NULL,'HQ',
                 '{"ru-RU":"Головной офис","uz-Cyrl-UZ":"Бош офис","uz-Latn-UZ":"Bosh ofis","en-US":"Headquarters"}'::jsonb,'BRANCH','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-dddddddd0002','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0001','FIN',
                 '{"ru-RU":"Финансы","uz-Cyrl-UZ":"Молия","uz-Latn-UZ":"Moliya","en-US":"Finance"}'::jsonb,'DEPARTMENT','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-dddddddd0003','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0002','FIN-TR',
                 '{"ru-RU":"Казначейство","uz-Cyrl-UZ":"Хазина","uz-Latn-UZ":"Xazina","en-US":"Treasury"}'::jsonb,'UNIT','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-dddddddd0004','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0001','IT',
                 '{"ru-RU":"ИТ","uz-Cyrl-UZ":"АТ","uz-Latn-UZ":"AT","en-US":"IT"}'::jsonb,'DIVISION','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');
      rollback:
        - sql:
            sql: |
              DELETE FROM departments
              WHERE project_id = '11111111-aaaa-1111-aaaa-111111110001';

  # -----------------------------------------------------------------------
  # 6) Positions — 5 positions (codes match frontend fixtures exactly).
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-006-positions
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase2
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM positions
              WHERE project_id = '11111111-aaaa-1111-aaaa-111111110001'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO positions
                (id, tenant_id, project_id, department_id, code, title_i18n,
                 function, category, job_family, job_level, status, version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-cccccccc0001','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0002','CFO',
                 '{"ru-RU":"Финансовый директор","uz-Cyrl-UZ":"Молия директори","uz-Latn-UZ":"Moliya direktori","en-US":"Chief Financial Officer"}'::jsonb,'Finance','C-level','Finance','L10','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-cccccccc0002','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0003','TREAS-HEAD',
                 '{"ru-RU":"Руководитель казначейства","uz-Cyrl-UZ":"Хазина бошлиғи","uz-Latn-UZ":"Xazina boshligʻi","en-US":"Head of Treasury"}'::jsonb,'Finance','Senior Manager','Finance','L8','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-cccccccc0003','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0004','CTO',
                 '{"ru-RU":"Технический директор","uz-Cyrl-UZ":"Технологиялар директори","uz-Latn-UZ":"Texnologiyalar direktori","en-US":"Chief Technology Officer"}'::jsonb,'Technology','C-level','IT','L10','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-cccccccc0004','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0004','SWE-SR',
                 '{"ru-RU":"Старший разработчик","uz-Cyrl-UZ":"Катта дастурчи","uz-Latn-UZ":"Katta dasturchi","en-US":"Senior Software Engineer"}'::jsonb,'Technology','Individual contributor','IT','L6','ACTIVE',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'),
                ('11111111-aaaa-1111-aaaa-cccccccc0005','11111111-1111-1111-1111-111111111111','11111111-aaaa-1111-aaaa-111111110001','11111111-aaaa-1111-aaaa-dddddddd0004','SWE-MID',
                 '{"ru-RU":"Разработчик","uz-Cyrl-UZ":"Дастурчи","uz-Latn-UZ":"Dasturchi","en-US":"Software Engineer"}'::jsonb,'Technology','Individual contributor','IT','L5','DRAFT',0,'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');
      rollback:
        - sql:
            sql: |
              DELETE FROM positions
              WHERE project_id = '11111111-aaaa-1111-aaaa-111111110001';

  # -----------------------------------------------------------------------
  # 7) Evaluations — CFO (APPROVED, all factors at level D = 75pts) and
  #    SWE-SR (SUBMITTED). WEIGHTED_POINTS: raw = weight * (points/100).
  #    CFO total: sum(weight)*0.75 = 100*0.75 = 75.0000.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-007-evaluations
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase5
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM evaluations
              WHERE project_id = '11111111-aaaa-1111-aaaa-111111110001'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- Both evaluations are INSERTed as DRAFT first: the
              -- prevent_score_changes_on_locked_evaluation trigger blocks
              -- evaluation_scores writes once status is APPROVED/LOCKED, so we
              -- (1) create DRAFT, (2) insert scores, (3) promote status via the
              -- forward DRAFT->SUBMITTED->APPROVED UPDATE path the lifecycle
              -- trigger allows. Mirrors the methodology-version DRAFT->APPROVED
              -- seed ordering above.
              INSERT INTO evaluations
                (id, tenant_id, project_id, position_id, methodology_version_id,
                 evaluator_user_id, status, raw_total_score, displayed_total_score,
                 version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-eeeeeeee0001',
                 '11111111-1111-1111-1111-111111111111',
                 '11111111-aaaa-1111-aaaa-111111110001',
                 '11111111-aaaa-1111-aaaa-cccccccc0001',
                 '11111111-aaaa-1111-aaaa-aaaaaaaa0002',
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                 'DRAFT', 75.0000, 75.00, 0,
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');

              INSERT INTO evaluations
                (id, tenant_id, project_id, position_id, methodology_version_id,
                 evaluator_user_id, status, raw_total_score, displayed_total_score,
                 version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-eeeeeeee0002',
                 '11111111-1111-1111-1111-111111111111',
                 '11111111-aaaa-1111-aaaa-111111110001',
                 '11111111-aaaa-1111-aaaa-cccccccc0004',
                 '11111111-aaaa-1111-aaaa-aaaaaaaa0002',
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                 'DRAFT', 75.0000, 75.00, 0,
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');

              -- Scores for BOTH evaluations (still DRAFT — writes allowed):
              -- every factor scored at level D (level_order 4, points 75).
              -- raw_factor_score = weight * 0.75.
              INSERT INTO evaluation_scores
                (id, tenant_id, evaluation_id, factor_id, factor_level_id,
                 raw_factor_score, is_manually_adjusted, version, created_by)
              SELECT
                gen_random_uuid(),
                f.tenant_id,
                ev.id,
                f.id,
                fl.id,
                round(f.weight * 0.75, 4),
                false,
                0,
                'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
              FROM factors f
              JOIN factor_levels fl
                ON fl.factor_id = f.id AND fl.level_order = 4
              CROSS JOIN (
                VALUES
                  ('11111111-aaaa-1111-aaaa-eeeeeeee0001'::uuid),
                  ('11111111-aaaa-1111-aaaa-eeeeeeee0002'::uuid)
              ) AS ev(id)
              WHERE f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';

              -- Promote both to SUBMITTED (forward transition, scores frozen).
              UPDATE evaluations
                 SET status = 'SUBMITTED',
                     submitted_at = now(),
                     submitted_by = 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
               WHERE id IN ('11111111-aaaa-1111-aaaa-eeeeeeee0001',
                            '11111111-aaaa-1111-aaaa-eeeeeeee0002')
                 AND status = 'DRAFT';

              -- CFO evaluation only: SUBMITTED -> APPROVED.
              UPDATE evaluations
                 SET status = 'APPROVED',
                     approved_at = now(),
                     approved_by = 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
               WHERE id = '11111111-aaaa-1111-aaaa-eeeeeeee0001'
                 AND status = 'SUBMITTED';
      rollback:
        - sql:
            sql: |
              DELETE FROM evaluation_scores es
              USING evaluations e
              WHERE es.evaluation_id = e.id
                AND e.project_id = '11111111-aaaa-1111-aaaa-111111110001';
              DELETE FROM evaluations
              WHERE project_id = '11111111-aaaa-1111-aaaa-111111110001';

  # -----------------------------------------------------------------------
  # 8) Backfill updated_at on the seeded CFO-FIN methodology (F-M1).
  #    ADDITIVE + idempotent on purpose: changeSet 001 above is already
  #    applied (runOnChange:false) on persistent/shared dev databases, so
  #    editing 001 in place would change its checksum and abort startup with
  #    ValidationFailedException. The methodologies.updated_at column has no
  #    DB default, so the seed INSERT left it NULL and the list UI's UPDATED
  #    column fell back to created_at. App-created methodologies already get
  #    updated_at from the JPA AuditingEntityListener; only the seed row
  #    needed this one-time backfill.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-008-methodology-updated-at
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM methodologies
              WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0001'
                AND updated_at IS NULL
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE methodologies
                 SET updated_at = now()
               WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0001'
                 AND updated_at IS NULL;
      rollback:
        - sql:
            sql: |
              SELECT 1;

  # -----------------------------------------------------------------------
  # 9) Backfill per-score localized rubric text (description_i18n) onto the
  #    CFO-FIN v1 (APPROVED) factor levels — the "Балл" rubric the evaluator
  #    reads before scoring (Excel K-sheet parity). The By-factor view renders
  #    the methodology's ACTIVE version (= v1 here), so descriptions MUST live
  #    on v1; a separate DRAFT version's text would never appear in the K-sheet.
  #
  #    v1 is APPROVED → trg_level_immutability_on_locked_version blocks UPDATEs.
  #    This is a one-time dev backfill (analogous to changeSet 008's
  #    updated_at backfill), so we briefly DISABLE that single trigger inside
  #    the changeSet transaction, write the text, then ENABLE it again — the
  #    lock is restored atomically. ADDITIVE + idempotent: never edit the
  #    already-applied changeSet 003 (that would change its checksum and abort
  #    startup on persistent dev DBs — see changeSet 008's note).
  #
  #    KNOWLEDGE carries full per-level rubric paragraphs in all 4 locales;
  #    the other 7 factors carry one meaningful sentence per level so every
  #    locale tab shows real content. JSON is dollar-quoted ($j$...$j$) so the
  #    Latin/English apostrophes need no SQL escaping; splitStatements:false so
  #    the DISABLE/UPDATE/ENABLE run as one server-side batch.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-009-level-descriptions
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM factor_levels fl
              JOIN factors f ON f.id = fl.factor_id
              WHERE f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002'
                AND f.code = 'KNOWLEDGE' AND fl.code = 'A'
                AND fl.description_i18n IS NULL
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE factor_levels DISABLE TRIGGER trg_level_immutability_on_locked_version;

              UPDATE factor_levels fl
                 SET description_i18n = m.descr::jsonb,
                     updated_at = now(),
                     updated_by = 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
              FROM factors f, (VALUES
                ('KNOWLEDGE','A',$j${"ru-RU":"Базовые профессиональные знания, достаточные для выполнения простых типовых задач под руководством.","uz-Cyrl-UZ":"Содда, оддий вазифаларни раҳбарлик остида бажариш учун етарли базавий касбий билим.","uz-Latn-UZ":"Sodda, oddiy vazifalarni rahbarlik ostida bajarish uchun yetarli bazaviy kasbiy bilim.","en-US":"Basic professional knowledge sufficient to perform simple, routine tasks under supervision."}$j$),
                ('KNOWLEDGE','B',$j${"ru-RU":"Рабочие знания основных процедур; выполняет стандартные задачи с эпизодической помощью.","uz-Cyrl-UZ":"Асосий жараёнлар бўйича амалий билим; стандарт вазифаларни баъзан ёрдам билан бажаради.","uz-Latn-UZ":"Asosiy jarayonlar bo'yicha amaliy bilim; standart vazifalarni ba'zan yordam bilan bajaradi.","en-US":"Working knowledge of core procedures; handles standard tasks with occasional guidance."}$j$),
                ('KNOWLEDGE','C',$j${"ru-RU":"Прочные специализированные знания в рамках функции; самостоятельно решает большинство задач.","uz-Cyrl-UZ":"Функция доирасида мустаҳкам ихтисослашган билим; кўпчилик вазифаларни мустақил ҳал қилади.","uz-Latn-UZ":"Funksiya doirasida mustahkam ixtisoslashgan bilim; ko'pchilik vazifalarni mustaqil hal qiladi.","en-US":"Solid specialized knowledge within the function; works independently on most tasks."}$j$),
                ('KNOWLEDGE','D',$j${"ru-RU":"Глубокая экспертиза; решает сложные нестандартные проблемы и обучает других.","uz-Cyrl-UZ":"Чуқур экспертлик; мураккаб ностандарт муаммоларни ҳал қилади ва бошқаларни ўргатади.","uz-Latn-UZ":"Chuqur ekspertlik; murakkab nostandart muammolarni hal qiladi va boshqalarni o'rgatadi.","en-US":"Deep expertise; resolves complex non-standard problems and mentors others."}$j$),
                ('KNOWLEDGE','E',$j${"ru-RU":"Признанный эксперт; формирует методы и стандарты, обладает стратегическим кросс-функциональным мастерством.","uz-Cyrl-UZ":"Тан олинган эксперт; усул ва стандартларни шакллантиради, стратегик кросс-функционал маҳоратга эга.","uz-Latn-UZ":"Tan olingan ekspert; usul va standartlarni shakllantiradi, strategik kross-funksional mahoratga ega.","en-US":"Recognized authority; shapes methods and standards with strategic, cross-domain mastery."}$j$),

                ('EXPERIENCE','A',$j${"ru-RU":"Минимальный опыт; до 1 года в профильной деятельности.","uz-Cyrl-UZ":"Минимал тажриба; йўналиш бўйича 1 йилгача.","uz-Latn-UZ":"Minimal tajriba; yo'nalish bo'yicha 1 yilgacha.","en-US":"Minimal experience; up to 1 year in the field."}$j$),
                ('EXPERIENCE','B',$j${"ru-RU":"Опыт 1–3 года; уверенно выполняет типовые задачи.","uz-Cyrl-UZ":"1–3 йил тажриба; оддий вазифаларни ишонч билан бажаради.","uz-Latn-UZ":"1–3 yil tajriba; oddiy vazifalarni ishonch bilan bajaradi.","en-US":"1–3 years; confidently handles routine tasks."}$j$),
                ('EXPERIENCE','C',$j${"ru-RU":"Опыт 3–6 лет; широкий практический опыт в функции.","uz-Cyrl-UZ":"3–6 йил тажриба; функция бўйича кенг амалий тажриба.","uz-Latn-UZ":"3–6 yil tajriba; funksiya bo'yicha keng amaliy tajriba.","en-US":"3–6 years; broad practical experience in the function."}$j$),
                ('EXPERIENCE','D',$j${"ru-RU":"Опыт 6–10 лет; ведёт сложные проекты.","uz-Cyrl-UZ":"6–10 йил тажриба; мураккаб лойиҳаларни бошқаради.","uz-Latn-UZ":"6–10 yil tajriba; murakkab loyihalarni boshqaradi.","en-US":"6–10 years; leads complex projects."}$j$),
                ('EXPERIENCE','E',$j${"ru-RU":"Свыше 10 лет; обширный экспертный опыт и наставничество.","uz-Cyrl-UZ":"10 йилдан ортиқ; кенг экспертлик тажрибаси ва устозлик.","uz-Latn-UZ":"10 yildan ortiq; keng ekspertlik tajribasi va ustozlik.","en-US":"Over 10 years; extensive expert experience and mentoring."}$j$),

                ('COMPLEXITY','A',$j${"ru-RU":"Простые повторяющиеся задачи с понятными решениями.","uz-Cyrl-UZ":"Аниқ ечимли содда такрорий вазифалар.","uz-Latn-UZ":"Aniq yechimli sodda takroriy vazifalar.","en-US":"Simple repetitive tasks with clear solutions."}$j$),
                ('COMPLEXITY','B',$j${"ru-RU":"Типовые задачи с небольшими вариациями.","uz-Cyrl-UZ":"Кичик ўзгаришли оддий вазифалар.","uz-Latn-UZ":"Kichik o'zgarishli oddiy vazifalar.","en-US":"Standard tasks with minor variations."}$j$),
                ('COMPLEXITY','C',$j${"ru-RU":"Задачи средней сложности, требующие анализа.","uz-Cyrl-UZ":"Таҳлил талаб қилувчи ўрта мураккабликдаги вазифалар.","uz-Latn-UZ":"Tahlil talab qiluvchi o'rta murakkablikdagi vazifalar.","en-US":"Medium-complexity tasks requiring analysis."}$j$),
                ('COMPLEXITY','D',$j${"ru-RU":"Сложные многофакторные задачи без готовых решений.","uz-Cyrl-UZ":"Тайёр ечими йўқ мураккаб кўп омилли вазифалар.","uz-Latn-UZ":"Tayyor yechimi yo'q murakkab ko'p omilli vazifalar.","en-US":"Complex multi-factor tasks without ready solutions."}$j$),
                ('COMPLEXITY','E',$j${"ru-RU":"Стратегические задачи высокой неопределённости.","uz-Cyrl-UZ":"Юқори ноаниқликдаги стратегик вазифалар.","uz-Latn-UZ":"Yuqori noaniqlikdagi strategik vazifalar.","en-US":"Strategic tasks of high uncertainty."}$j$),

                ('RESPONSIBILITY','A',$j${"ru-RU":"Отвечает за собственные результаты в рамках задачи.","uz-Cyrl-UZ":"Вазифа доирасида ўз натижалари учун жавобгар.","uz-Latn-UZ":"Vazifa doirasida o'z natijalari uchun javobgar.","en-US":"Accountable for own results within the task."}$j$),
                ('RESPONSIBILITY','B',$j${"ru-RU":"Отвечает за качество своей работы и сроки.","uz-Cyrl-UZ":"Ўз ишининг сифати ва муддатлари учун жавобгар.","uz-Latn-UZ":"O'z ishining sifati va muddatlari uchun javobgar.","en-US":"Accountable for quality and deadlines of own work."}$j$),
                ('RESPONSIBILITY','C',$j${"ru-RU":"Отвечает за результаты участка работ или малой группы.","uz-Cyrl-UZ":"Иш участкаси ёки кичик гуруҳ натижалари учун жавобгар.","uz-Latn-UZ":"Ish uchastkasi yoki kichik guruh natijalari uchun javobgar.","en-US":"Accountable for a work area or a small team's results."}$j$),
                ('RESPONSIBILITY','D',$j${"ru-RU":"Отвечает за результаты подразделения и ресурсы.","uz-Cyrl-UZ":"Бўлинма натижалари ва ресурслар учун жавобгар.","uz-Latn-UZ":"Bo'linma natijalari va resurslar uchun javobgar.","en-US":"Accountable for a unit's results and resources."}$j$),
                ('RESPONSIBILITY','E',$j${"ru-RU":"Отвечает за стратегические результаты организации.","uz-Cyrl-UZ":"Ташкилотнинг стратегик натижалари учун жавобгар.","uz-Latn-UZ":"Tashkilotning strategik natijalari uchun javobgar.","en-US":"Accountable for the organization's strategic results."}$j$),

                ('AUTONOMY','A',$j${"ru-RU":"Работает под постоянным контролем по инструкциям.","uz-Cyrl-UZ":"Доимий назорат остида кўрсатмалар бўйича ишлайди.","uz-Latn-UZ":"Doimiy nazorat ostida ko'rsatmalar bo'yicha ishlaydi.","en-US":"Works under constant supervision following instructions."}$j$),
                ('AUTONOMY','B',$j${"ru-RU":"Работает по инструкциям с периодическим контролем.","uz-Cyrl-UZ":"Кўрсатмалар бўйича даврий назорат билан ишлайди.","uz-Latn-UZ":"Ko'rsatmalar bo'yicha davriy nazorat bilan ishlaydi.","en-US":"Works to instructions with periodic supervision."}$j$),
                ('AUTONOMY','C',$j${"ru-RU":"Самостоятелен в рамках своей зоны; контроль по результату.","uz-Cyrl-UZ":"Ўз соҳасида мустақил; натижа бўйича назорат.","uz-Latn-UZ":"O'z sohasida mustaqil; natija bo'yicha nazorat.","en-US":"Independent within own area; reviewed by outcome."}$j$),
                ('AUTONOMY','D',$j${"ru-RU":"Высокая самостоятельность; определяет методы работы.","uz-Cyrl-UZ":"Юқори мустақиллик; иш усулларини белгилайди.","uz-Latn-UZ":"Yuqori mustaqillik; ish usullarini belgilaydi.","en-US":"High autonomy; defines own working methods."}$j$),
                ('AUTONOMY','E',$j${"ru-RU":"Полная автономия; задаёт направление и политику.","uz-Cyrl-UZ":"Тўлиқ мустақиллик; йўналиш ва сиёсатни белгилайди.","uz-Latn-UZ":"To'liq mustaqillik; yo'nalish va siyosatni belgilaydi.","en-US":"Full autonomy; sets direction and policy."}$j$),

                ('INFLUENCE','A',$j${"ru-RU":"Влияние ограничено собственными задачами.","uz-Cyrl-UZ":"Таъсир ўз вазифалари билан чегараланган.","uz-Latn-UZ":"Ta'sir o'z vazifalari bilan chegaralangan.","en-US":"Influence limited to own tasks."}$j$),
                ('INFLUENCE','B',$j${"ru-RU":"Влияет на ближайших коллег по работе.","uz-Cyrl-UZ":"Яқин ҳамкасбларга таъсир кўрсатади.","uz-Latn-UZ":"Yaqin hamkasblarga ta'sir ko'rsatadi.","en-US":"Influences immediate colleagues."}$j$),
                ('INFLUENCE','C',$j${"ru-RU":"Влияет на работу группы или смежных функций.","uz-Cyrl-UZ":"Гуруҳ ёки қўшни функциялар ишига таъсир қилади.","uz-Latn-UZ":"Guruh yoki qo'shni funksiyalar ishiga ta'sir qiladi.","en-US":"Influences a group or adjacent functions."}$j$),
                ('INFLUENCE','D',$j${"ru-RU":"Влияет на результаты подразделения и партнёров.","uz-Cyrl-UZ":"Бўлинма натижалари ва ҳамкорларга таъсир қилади.","uz-Latn-UZ":"Bo'linma natijalari va hamkorlarga ta'sir qiladi.","en-US":"Influences unit results and partners."}$j$),
                ('INFLUENCE','E',$j${"ru-RU":"Влияет на стратегию и внешних стейкхолдеров.","uz-Cyrl-UZ":"Стратегия ва ташқи манфаатдорларга таъсир қилади.","uz-Latn-UZ":"Strategiya va tashqi manfaatdorlarga ta'sir qiladi.","en-US":"Influences strategy and external stakeholders."}$j$),

                ('COMMUNICATION','A',$j${"ru-RU":"Обмен простой информацией в рамках задач.","uz-Cyrl-UZ":"Вазифалар доирасида содда ахборот алмашиш.","uz-Latn-UZ":"Vazifalar doirasida sodda axborot almashish.","en-US":"Exchanging simple information within tasks."}$j$),
                ('COMMUNICATION','B',$j${"ru-RU":"Разъяснение информации коллегам и клиентам.","uz-Cyrl-UZ":"Ҳамкасблар ва мижозларга маълумотни тушунтириш.","uz-Latn-UZ":"Hamkasblar va mijozlarga ma'lumotni tushuntirish.","en-US":"Explaining information to colleagues and clients."}$j$),
                ('COMMUNICATION','C',$j${"ru-RU":"Согласование и убеждение внутри функции.","uz-Cyrl-UZ":"Функция ичида келишув ва ишонтириш.","uz-Latn-UZ":"Funksiya ichida kelishuv va ishontirish.","en-US":"Aligning and persuading within the function."}$j$),
                ('COMMUNICATION','D',$j${"ru-RU":"Переговоры со сложными сторонами и партнёрами.","uz-Cyrl-UZ":"Мураккаб томонлар ва ҳамкорлар билан музокаралар.","uz-Latn-UZ":"Murakkab tomonlar va hamkorlar bilan muzokaralar.","en-US":"Negotiating with complex parties and partners."}$j$),
                ('COMMUNICATION','E',$j${"ru-RU":"Влиятельные переговоры на высшем уровне.","uz-Cyrl-UZ":"Олий даражадаги таъсирли музокаралар.","uz-Latn-UZ":"Oliy darajadagi ta'sirli muzokaralar.","en-US":"Influential negotiations at the highest level."}$j$),

                ('WORKING_CONDITIONS','A',$j${"ru-RU":"Комфортные офисные условия без нагрузок.","uz-Cyrl-UZ":"Қулай офис шароити, юкламасиз.","uz-Latn-UZ":"Qulay ofis sharoiti, yuklamasiz.","en-US":"Comfortable office conditions with no strain."}$j$),
                ('WORKING_CONDITIONS','B',$j${"ru-RU":"Обычные условия с редкими неудобствами.","uz-Cyrl-UZ":"Одатдаги шароит, кам ноқулайликлар билан.","uz-Latn-UZ":"Odatdagi sharoit, kam noqulayliklar bilan.","en-US":"Normal conditions with rare inconveniences."}$j$),
                ('WORKING_CONDITIONS','C',$j${"ru-RU":"Периодические нагрузки или разъезды.","uz-Cyrl-UZ":"Даврий юкламалар ёки сафарлар.","uz-Latn-UZ":"Davriy yuklamalar yoki safarlar.","en-US":"Periodic workload peaks or travel."}$j$),
                ('WORKING_CONDITIONS','D',$j${"ru-RU":"Частые нагрузки, давление сроков или поездки.","uz-Cyrl-UZ":"Тез-тез юкламалар, муддат босими ёки сафарлар.","uz-Latn-UZ":"Tez-tez yuklamalar, muddat bosimi yoki safarlar.","en-US":"Frequent workload, deadline pressure or travel."}$j$),
                ('WORKING_CONDITIONS','E',$j${"ru-RU":"Постоянные высокие нагрузки и сложные условия.","uz-Cyrl-UZ":"Доимий юқори юклама ва оғир шароитлар.","uz-Latn-UZ":"Doimiy yuqori yuklama va og'ir sharoitlar.","en-US":"Constant high workload and demanding conditions."}$j$)
              ) AS m(factor_code, level_code, descr)
              WHERE fl.factor_id = f.id
                AND f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002'
                AND f.code = m.factor_code
                AND fl.code = m.level_code;

              ALTER TABLE factor_levels ENABLE TRIGGER trg_level_immutability_on_locked_version;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE factor_levels DISABLE TRIGGER trg_level_immutability_on_locked_version;
              UPDATE factor_levels fl
                 SET description_i18n = NULL
              FROM factors f
              WHERE fl.factor_id = f.id
                AND f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';
              ALTER TABLE factor_levels ENABLE TRIGGER trg_level_immutability_on_locked_version;

  # -----------------------------------------------------------------------
  # 10) DRAFT version 2 of CFO-FIN — a clone of v1's factors + levels
  #     (INCLUDING the description_i18n just backfilled in changeSet 009) so
  #     the Methodology Builder can be opened in EDIT mode and the new
  #     FactorLevelEditor label/description CRUD is browser-verifiable.
  #
  #     active_version_id = latest APPROVED/LOCKED version (MethodologyResponse
  #     #fromList), so this DRAFT v2 does NOT become the active version — the
  #     K-sheet keeps reading v1 and the existing v1 evaluations are untouched.
  #     Factors/levels get fresh random UUIDs mapped v1→v2 by `code` via a
  #     data-modifying CTE; v2 is DRAFT so the immutability trigger permits the
  #     inserts. Idempotent: skipped once v2 exists.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-010-draft-version
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM methodology_versions
              WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0003'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO methodology_versions
                (id, tenant_id, methodology_id, version_number, status,
                 scoring_mode, target_total_points, previous_version_id,
                 version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-aaaaaaaa0003',
                 '11111111-1111-1111-1111-111111111111',
                 '11111111-aaaa-1111-aaaa-aaaaaaaa0001',
                 2,
                 'DRAFT',
                 'WEIGHTED_POINTS',
                 1000,
                 '11111111-aaaa-1111-aaaa-aaaaaaaa0002',
                 0,
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');

              WITH new_factors AS (
                INSERT INTO factors
                  (id, tenant_id, methodology_version_id, code, name_i18n,
                   description_i18n, weight, max_points, sort_order, required,
                   version, created_by)
                SELECT
                  gen_random_uuid(),
                  f.tenant_id,
                  '11111111-aaaa-1111-aaaa-aaaaaaaa0003',
                  f.code,
                  f.name_i18n,
                  f.description_i18n,
                  f.weight,
                  f.max_points,
                  f.sort_order,
                  f.required,
                  0,
                  'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
                FROM factors f
                WHERE f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002'
                RETURNING id, code
              )
              INSERT INTO factor_levels
                (id, tenant_id, factor_id, code, level_order, points,
                 scale_value, label_i18n, description_i18n, version, created_by)
              SELECT
                gen_random_uuid(),
                fl.tenant_id,
                nf.id,
                fl.code,
                fl.level_order,
                fl.points,
                fl.scale_value,
                fl.label_i18n,
                fl.description_i18n,
                0,
                'aaaa1111-aaaa-1111-aaaa-1111aaaa1111'
              FROM factor_levels fl
              JOIN factors src_f
                ON src_f.id = fl.factor_id
               AND src_f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002'
              JOIN new_factors nf ON nf.code = src_f.code;
      rollback:
        - sql:
            sql: |
              DELETE FROM factor_levels fl
              USING factors f
              WHERE fl.factor_id = f.id
                AND f.methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0003';
              DELETE FROM factors
              WHERE methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0003';
              DELETE FROM methodology_versions
              WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0003';

  # -----------------------------------------------------------------------
  # 11) A DRAFT evaluation for the CTO position on v1 (the ACTIVE version) so
  #     the By-factor K-sheet has a SCORABLE row: DRAFT is not locked, so the
  #     evaluator can read the rubric (changeSet 009 text) and assign a score
  #     — demonstrating the "read description, then score" flow end-to-end.
  #     The two pre-existing evaluations (CFO=APPROVED, SWE-SR=SUBMITTED) stay
  #     locked by design; this adds a fresh editable one without touching them.
  #     No evaluation_scores are seeded — the row starts empty on purpose.
  #     Idempotent: skipped once a CTO evaluation exists.
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-011-draft-evaluation
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase5
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM evaluations
              WHERE position_id = '11111111-aaaa-1111-aaaa-cccccccc0003'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO evaluations
                (id, tenant_id, project_id, position_id, methodology_version_id,
                 evaluator_user_id, status, raw_total_score, displayed_total_score,
                 version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-eeeeeeee0003',
                 '11111111-1111-1111-1111-111111111111',
                 '11111111-aaaa-1111-aaaa-111111110001',
                 '11111111-aaaa-1111-aaaa-cccccccc0003',
                 '11111111-aaaa-1111-aaaa-aaaaaaaa0002',
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111',
                 'DRAFT', 0, 0, 0,
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');
      rollback:
        - sql:
            sql: |
              DELETE FROM evaluation_scores
              WHERE evaluation_id = '11111111-aaaa-1111-aaaa-eeeeeeee0003';
              DELETE FROM evaluations
              WHERE id = '11111111-aaaa-1111-aaaa-eeeeeeee0003';

# =========================================================================
# DEV-ONLY SEED — methodology + factors + levels + organization + positions
#                 + evaluations (BE-SEED-004). Never runs outside `dev`.
# =========================================================================
#
# Purpose: give the local dev environment (and the frontend running with
# VITE_USE_MSW=false against the real API) the same demo data that the MSW
# mock layer ships in `frontend/src/shared/api/mocks/fixtures.ts`. The codes
# below are kept IDENTICAL to the frontend fixtures so the two surfaces show
# the same data — single source of truth, no divergent demo content:
#
#   methodology code  : CFO-FIN  (type CLASSIC_8_FACTOR, version 1 APPROVED)
#   factor codes      : KNOWLEDGE, EXPERIENCE, COMPLEXITY, RESPONSIBILITY,
#                       AUTONOMY, INFLUENCE, COMMUNICATION, WORKING_CONDITIONS
#   factor weights    : 15, 12, 14, 15, 10, 12, 10, 12  (sum = 100)
#   level points      : 10, 25, 50, 75, 100  (5 levels per factor)
#   position codes    : CFO, TREAS-HEAD, CTO, SWE-SR, SWE-MID
#   evaluations       : CFO (APPROVED, ~75 pts), SWE-SR (SUBMITTED)
#
# All rows are scoped to the ACME project seeded in 001-dev-seed-tenants.yaml:
#   tenant_id  = 11111111-1111-1111-1111-111111111111  (ACME)
#   project_id = 11111111-aaaa-1111-aaaa-111111110001  (ACME-GRADE-2026)
#
# PRODUCTION SAFETY:
#   - Every changeSet declares `context: dev`. Production's contexts list does
#     NOT include `dev`, so Liquibase refuses to apply these rows in prod.
#   - All changeSets are idempotent via preConditions sqlCheck.
#
# ORDERING NOTE (DB triggers):
#   factors / factor_levels can only be written while the parent
#   methodology_version is in DRAFT (trg_factor_immutability_on_locked_version).
#   We therefore: (1) create the version as DRAFT, (2) insert factors+levels,
#   (3) UPDATE the version to APPROVED. The mv-status-regression trigger allows
#   DRAFT -> APPROVED. Evaluations are INSERTed directly with their final
#   status (the status-immutability trigger only fires on UPDATE, not INSERT).

databaseChangeLog:

  # -----------------------------------------------------------------------
  # 1) Methodology (CFO-FIN) + version 1 (created as DRAFT first)
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-001-methodology
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM methodologies
              WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0001'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO methodologies
                (id, tenant_id, project_id, code, name_i18n, description_i18n,
                 methodology_type, status, version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-aaaaaaaa0001',
                 '11111111-1111-1111-1111-111111111111',
                 '11111111-aaaa-1111-aaaa-111111110001',
                 'CFO-FIN',
                 '{"ru-RU":"CFO Финансы — методология","uz-Cyrl-UZ":"CFO Молия — методология","uz-Latn-UZ":"CFO Moliya — metodologiya","en-US":"CFO Finance — methodology"}'::jsonb,
                 '{"ru-RU":"Методология грейдинга для финансовых должностей.","uz-Cyrl-UZ":"Молиявий лавозимлар учун грейдинг методологияси.","uz-Latn-UZ":"Moliyaviy lavozimlar uchun greyding metodologiyasi.","en-US":"Grading methodology for finance positions."}'::jsonb,
                 'CLASSIC_8_FACTOR',
                 'ACTIVE',
                 0,
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');

              INSERT INTO methodology_versions
                (id, tenant_id, methodology_id, version_number, status,
                 scoring_mode, target_total_points, version, created_by)
              VALUES
                ('11111111-aaaa-1111-aaaa-aaaaaaaa0002',
                 '11111111-1111-1111-1111-111111111111',
                 '11111111-aaaa-1111-aaaa-aaaaaaaa0001',
                 1,
                 'DRAFT',
                 'WEIGHTED_POINTS',
                 1000,
                 0,
                 'aaaa1111-aaaa-1111-aaaa-1111aaaa1111');
      rollback:
        - sql:
            sql: |
              DELETE FROM methodology_versions WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002';
              DELETE FROM methodologies WHERE id = '11111111-aaaa-1111-aaaa-aaaaaaaa0001';

  # -----------------------------------------------------------------------
  # 2) 8 factors (codes + weights match frontend fixtures exactly)
  # -----------------------------------------------------------------------
  - changeSet:
      id: dev-seed-meth-002-factors
      author: backend-engineer
      context: dev
      labels: dev-seed,mvp1,phase4
      runOnChange: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT count(*) FROM factors
              WHERE methodology_version_id = '11111111-aaaa-1111-aaaa-aaaaaaaa0002'
      changes:
        - sql:

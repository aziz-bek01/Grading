# Seed: default role -> permission grants for MVP 1.
#
# Source of truth: docs/mvp1/role-permissions-matrix.md (hr-product-owner +
# security-engineer authorship).
#
# Hard rules encoded here (DO NOT MODIFY without product owner + security review):
#   1. SALARY_VIEW / SALARY_EDIT / SALARY_EXPORT / SALARY_SCENARIO_RUN
#      are granted to NO role by default. Salary is per-user only via
#      user_tenant_memberships.salary_data_permission + per-user grants.
#   2. AUDIT_READ is granted ONLY to HRLAB_SUPER_ADMIN and EXTERNAL_AUDITOR.
#   3. TENANT_CREATE and TENANT_EDIT are granted ONLY to HRLAB_SUPER_ADMIN.
#   4. USER_ACCESS_MANAGE is granted only to HRLAB_SUPER_ADMIN and CLIENT_COMPANY_ADMIN.
#   5. AI_ASSIST_USE is granted to NO role (MVP 4 module).
#
# Each insert uses sub-selects against `public.roles.code` and
# `public.permissions.code` so the seed is independent of the random UUIDs
# generated by 001-default-permissions.yaml and 002-default-roles.yaml.
#
# ON CONFLICT DO NOTHING makes the changeset idempotent — re-running it does
# not duplicate rows, and partial prior application is tolerated.
#
# Total expected rows after this seed: 151 (see §4 of the matrix doc).

databaseChangeLog:
  - changeSet:
      id: seed-default-role-permissions
      author: hr-product-owner
      context: seeds
      labels: mvp1
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- =====================================================================
              -- 1. HRLAB_SUPER_ADMIN — 29 permissions
              --    All control-plane + business permissions EXCEPT all SALARY_*
              --    permissions and AI_ASSIST_USE. AUDIT_READ granted.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'TENANT_READ','TENANT_CREATE','TENANT_EDIT',
                  'PROJECT_READ','PROJECT_CREATE','PROJECT_EDIT',
                  'ORG_READ','ORG_EDIT',
                  'POSITION_READ','POSITION_CREATE','POSITION_EDIT',
                  'JOB_PROFILE_READ','JOB_PROFILE_EDIT',
                  'METHODOLOGY_READ','METHODOLOGY_EDIT','METHODOLOGY_APPROVE','METHODOLOGY_LOCK',
                  'EVALUATION_READ','EVALUATION_EDIT','EVALUATION_APPROVE',
                  'GRADE_READ','GRADE_EDIT',
                  'REPORT_READ','REPORT_CREATE','REPORT_EXPORT',
                  'AUDIT_READ','USER_ACCESS_MANAGE',
                  'FILE_UPLOAD','FILE_DOWNLOAD'
                )
               WHERE r.code = 'HRLAB_SUPER_ADMIN'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 2. HRLAB_PROJECT_MANAGER — 25 permissions
              --    Project lifecycle, methodology approve/lock, evaluation approve,
              --    grade edit, report export. No tenant create/edit, no user
              --    management, no audit.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'TENANT_READ',
                  'PROJECT_READ','PROJECT_CREATE','PROJECT_EDIT',
                  'ORG_READ','ORG_EDIT',
                  'POSITION_READ','POSITION_CREATE','POSITION_EDIT',
                  'JOB_PROFILE_READ','JOB_PROFILE_EDIT',
                  'METHODOLOGY_READ','METHODOLOGY_EDIT','METHODOLOGY_APPROVE','METHODOLOGY_LOCK',
                  'EVALUATION_READ','EVALUATION_EDIT','EVALUATION_APPROVE',
                  'GRADE_READ','GRADE_EDIT',
                  'REPORT_READ','REPORT_CREATE','REPORT_EXPORT',
                  'FILE_UPLOAD','FILE_DOWNLOAD'
                )
               WHERE r.code = 'HRLAB_PROJECT_MANAGER'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 3. HRLAB_CONSULTANT — 16 permissions
              --    Hands-on methodology and evaluation builder. No approve/lock,
              --    no audit. ABAC narrows further to assigned tenants only.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ','ORG_EDIT',
                  'POSITION_READ','POSITION_CREATE','POSITION_EDIT',
                  'JOB_PROFILE_READ','JOB_PROFILE_EDIT',
                  'METHODOLOGY_READ','METHODOLOGY_EDIT',
                  'EVALUATION_READ','EVALUATION_EDIT',
                  'GRADE_READ',
                  'REPORT_READ',
                  'FILE_UPLOAD','FILE_DOWNLOAD'
                )
               WHERE r.code = 'HRLAB_CONSULTANT'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 4. HRLAB_ANALYST — 15 permissions
              --    Import + analysis role. Org/position/profile edit for data prep.
              --    No methodology edit, no approvals.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ','ORG_EDIT',
                  'POSITION_READ','POSITION_CREATE','POSITION_EDIT',
                  'JOB_PROFILE_READ','JOB_PROFILE_EDIT',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ',
                  'GRADE_READ',
                  'REPORT_READ','REPORT_CREATE',
                  'FILE_UPLOAD','FILE_DOWNLOAD'
                )
               WHERE r.code = 'HRLAB_ANALYST'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 5. CLIENT_COMPANY_ADMIN — 11 permissions
              --    Manages users in own tenant. Read-only on business data.
              --    No audit (audit is for HRLab Super Admin + External Auditor).
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'TENANT_READ',
                  'PROJECT_READ',
                  'ORG_READ',
                  'POSITION_READ',
                  'JOB_PROFILE_READ',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ',
                  'GRADE_READ',
                  'REPORT_READ',
                  'USER_ACCESS_MANAGE',
                  'FILE_DOWNLOAD'
                )
               WHERE r.code = 'CLIENT_COMPANY_ADMIN'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 6. CLIENT_HR_DIRECTOR — 10 permissions
              --    Business owner for own tenant. Approves evaluations. No
              --    methodology edit (HRLab is methodology authority). No audit.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ',
                  'POSITION_READ',
                  'JOB_PROFILE_READ',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ','EVALUATION_APPROVE',
                  'GRADE_READ',
                  'REPORT_READ',
                  'FILE_DOWNLOAD'
                )
               WHERE r.code = 'CLIENT_HR_DIRECTOR'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 7. CLIENT_HR_SPECIALIST — 12 permissions
              --    Operational HR: position/profile create + edit, file ops.
              --    No approvals, no methodology edit, no grade edit.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ',
                  'POSITION_READ','POSITION_CREATE','POSITION_EDIT',
                  'JOB_PROFILE_READ','JOB_PROFILE_EDIT',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ',
                  'GRADE_READ',
                  'FILE_UPLOAD','FILE_DOWNLOAD'
                )
               WHERE r.code = 'CLIENT_HR_SPECIALIST'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 8. EVALUATION_COMMITTEE_MEMBER — 7 permissions
              --    Project-scoped scorer. EVALUATION_EDIT for scoring + comments.
              --    No approvals (committee scores; HR Director / PM approves).
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'POSITION_READ',
                  'JOB_PROFILE_READ',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ','EVALUATION_EDIT',
                  'FILE_DOWNLOAD'
                )
               WHERE r.code = 'EVALUATION_COMMITTEE_MEMBER'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 9. DEPARTMENT_MANAGER — 7 permissions
              --    Department-scoped consumer (ABAC department_scope claim).
              --    Read-only across business modules. No create/edit/approve.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ',
                  'POSITION_READ',
                  'JOB_PROFILE_READ',
                  'EVALUATION_READ',
                  'GRADE_READ',
                  'FILE_DOWNLOAD'
                )
               WHERE r.code = 'DEPARTMENT_MANAGER'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 10. VIEWER — 9 permissions
              --     Pure read-only on permitted (approved) entities.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ',
                  'POSITION_READ',
                  'JOB_PROFILE_READ',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ',
                  'GRADE_READ',
                  'REPORT_READ',
                  'FILE_DOWNLOAD'
                )
               WHERE r.code = 'VIEWER'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

              -- =====================================================================
              -- 11. EXTERNAL_AUDITOR — 10 permissions
              --     Read-everything-on-own-tenant + AUDIT_READ. No edit, no export.
              -- =====================================================================
              INSERT INTO public.role_permissions (role_id, permission_id)
              SELECT r.id, p.id
                FROM public.roles r
                JOIN public.permissions p ON p.code IN (
                  'PROJECT_READ',
                  'ORG_READ',
                  'POSITION_READ',
                  'JOB_PROFILE_READ',
                  'METHODOLOGY_READ',
                  'EVALUATION_READ',
                  'GRADE_READ',
                  'REPORT_READ',
                  'AUDIT_READ',
                  'FILE_DOWNLOAD'
                )
               WHERE r.code = 'EXTERNAL_AUDITOR'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

      rollback:
        - sql:
            sql: |
              -- Rollback removes every role_permission row inserted by this seed.
              -- Safe because Phase 0+1 ships with role_permissions otherwise empty.
              DELETE FROM public.role_permissions
               WHERE (role_id, permission_id) IN (

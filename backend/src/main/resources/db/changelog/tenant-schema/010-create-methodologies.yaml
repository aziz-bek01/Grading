# Phase 4 — methodologies + methodology_versions tables (database-blueprint §5.2,
# architecture §9 Domain Model). A Methodology is the long-lived container
# that owns one or more MethodologyVersion rows; only the version carries the
# DRAFT/APPROVED/LOCKED/ARCHIVED state machine + the factor structure.
#
# Hard constraints encoded here:
#   - methodologies.code is unique per (tenant_id, project_id) — global HRLab
#     templates have project_id NULL; project-scoped methodologies set it.
#   - methodology_versions.version_number is unique per methodology
#   - status CHECK constraints match the domain enums
#   - methodology_versions.scoring_mode is fixed at creation (cannot be edited
#     post-DRAFT — enforced at the service layer)
databaseChangeLog:

  - changeSet:
      id: tenant-010-create-methodologies
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase4
      changes:
        - createTable:
            tableName: methodologies
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              # NULL = global HRLab template; non-NULL = project-scoped instance
              - column:
                  name: project_id
                  type: UUID
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: name_i18n
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: description_i18n
                  type: JSONB
              - column:
                  name: methodology_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              # standard audit columns
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - sql:
            sql: |
              ALTER TABLE methodologies
                ADD CONSTRAINT fk_methodologies_tenant
                FOREIGN KEY (tenant_id) REFERENCES public.tenants(id)
                ON DELETE RESTRICT ON UPDATE NO ACTION;
              ALTER TABLE methodologies
                ADD CONSTRAINT fk_methodologies_project
                FOREIGN KEY (project_id) REFERENCES projects(id);
              ALTER TABLE methodologies
                ADD CONSTRAINT chk_methodologies_status
                CHECK (status IN ('ACTIVE','ARCHIVED'));
              ALTER TABLE methodologies
                ADD CONSTRAINT chk_methodologies_type
                CHECK (methodology_type IN ('CLASSIC_8_FACTOR','EXTENDED_11_CRITERIA','CUSTOM'));

              -- Unique code per (tenant, project) — project_id NULL means global template.
              -- Two partial unique indexes cover the NULL / NOT NULL halves.
              CREATE UNIQUE INDEX uq_methodologies_tenant_project_code
                ON methodologies (tenant_id, project_id, code)
                WHERE project_id IS NOT NULL;
              CREATE UNIQUE INDEX uq_methodologies_tenant_global_code
                ON methodologies (tenant_id, code)
                WHERE project_id IS NULL;
              CREATE INDEX idx_methodologies_tenant_status
                ON methodologies (tenant_id, status);
              CREATE INDEX idx_methodologies_tenant_project
                ON methodologies (tenant_id, project_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_methodologies_tenant_project;
              DROP INDEX IF EXISTS idx_methodologies_tenant_status;
              DROP INDEX IF EXISTS uq_methodologies_tenant_global_code;
              DROP INDEX IF EXISTS uq_methodologies_tenant_project_code;
        - dropTable:
            tableName: methodologies

  - changeSet:
      id: tenant-010-create-methodology-versions
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase4
      changes:
        - createTable:
            tableName: methodology_versions
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: methodology_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: version_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: scoring_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: target_total_points
                  type: NUMERIC(12,4)
              - column:
                  name: previous_version_id
                  type: UUID
              - column:
                  name: approved_at
                  type: TIMESTAMPTZ
              - column:
                  name: approved_by
                  type: UUID
              - column:
                  name: locked_at
                  type: TIMESTAMPTZ
              - column:
                  name: locked_by
                  type: UUID
              # standard audit columns
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - sql:
            sql: |
              ALTER TABLE methodology_versions
                ADD CONSTRAINT fk_mv_tenant
                FOREIGN KEY (tenant_id) REFERENCES public.tenants(id)
                ON DELETE RESTRICT ON UPDATE NO ACTION;
              ALTER TABLE methodology_versions
                ADD CONSTRAINT fk_mv_methodology
                FOREIGN KEY (methodology_id) REFERENCES methodologies(id)
                ON DELETE RESTRICT;
              ALTER TABLE methodology_versions
                ADD CONSTRAINT fk_mv_previous_version
                FOREIGN KEY (previous_version_id) REFERENCES methodology_versions(id);
              ALTER TABLE methodology_versions
                ADD CONSTRAINT chk_mv_status
                CHECK (status IN ('DRAFT','APPROVED','LOCKED','ARCHIVED'));
              ALTER TABLE methodology_versions
                ADD CONSTRAINT chk_mv_scoring_mode
                CHECK (scoring_mode IN ('DIRECT_POINTS','WEIGHTED_POINTS','WEIGHTED_SCALE'));
              ALTER TABLE methodology_versions
                ADD CONSTRAINT chk_mv_version_number_positive
                CHECK (version_number >= 1);

              CREATE UNIQUE INDEX uq_mv_methodology_version_number
                ON methodology_versions (tenant_id, methodology_id, version_number);
              CREATE INDEX idx_mv_methodology
                ON methodology_versions (tenant_id, methodology_id, version_number DESC);
              CREATE INDEX idx_mv_status
                ON methodology_versions (tenant_id, status);
              CREATE INDEX idx_mv_previous_version
                ON methodology_versions (previous_version_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_mv_previous_version;
              DROP INDEX IF EXISTS idx_mv_status;
              DROP INDEX IF EXISTS idx_mv_methodology;
              DROP INDEX IF EXISTS uq_mv_methodology_version_number;
        - dropTable:
            tableName: methodology_versions

  - changeSet:
      id: tenant-010-mv-status-immutability-trigger
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase4
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              -- DB-level safeguard: methodology_versions status cannot regress.
              -- LOCKED can only transition to ARCHIVED. APPROVED can move to
              -- LOCKED or ARCHIVED. ARCHIVED is terminal. DRAFT can move to
              -- APPROVED or ARCHIVED. Application service enforces this too;
              -- the trigger is defence-in-depth (security-blueprint §9).
              CREATE OR REPLACE FUNCTION prevent_mv_status_regression()
              RETURNS trigger AS $$
              BEGIN
                IF OLD.status = NEW.status THEN
                  RETURN NEW;
                END IF;
                IF OLD.status = 'ARCHIVED' THEN
                  RAISE EXCEPTION 'METHODOLOGY_VERSION_LOCKED: archived versions cannot be modified (id=%)', OLD.id
                    USING ERRCODE = '23514';
                END IF;
                IF OLD.status = 'LOCKED' AND NEW.status NOT IN ('ARCHIVED') THEN
                  RAISE EXCEPTION 'METHODOLOGY_VERSION_LOCKED: locked version (id=%) can only transition to ARCHIVED, attempted=%', OLD.id, NEW.status
                    USING ERRCODE = '23514';
                END IF;
                IF OLD.status = 'APPROVED' AND NEW.status NOT IN ('LOCKED','ARCHIVED') THEN
                  RAISE EXCEPTION 'METHODOLOGY_VERSION_LOCKED: approved version (id=%) cannot regress to %', OLD.id, NEW.status
                    USING ERRCODE = '23514';
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS trg_mv_status_immutability ON methodology_versions;
              CREATE TRIGGER trg_mv_status_immutability
                BEFORE UPDATE OF status ON methodology_versions
                FOR EACH ROW
                EXECUTE FUNCTION prevent_mv_status_regression();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_mv_status_immutability ON methodology_versions;
              DROP FUNCTION IF EXISTS prevent_mv_status_regression();

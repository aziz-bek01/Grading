              ALTER TABLE evaluation_calibration_events
                ADD CONSTRAINT fk_eval_calib_evaluation
                FOREIGN KEY (evaluation_id) REFERENCES evaluations(id)
                ON DELETE CASCADE;
              ALTER TABLE evaluation_calibration_events
                ADD CONSTRAINT fk_eval_calib_factor
                FOREIGN KEY (factor_id) REFERENCES factors(id)

              DROP INDEX IF EXISTS idx_eval_calib_evaluation;
        - dropTable:
            tableName: evaluation_calibration_events

  - changeSet:
      id: tenant-015-evaluation-status-immutability-trigger
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase5
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              -- DB-level safeguard: evaluation status state machine.
              --   DRAFT/INCOMPLETE/COMPLETE  ↔ each other (recomputed automatically)
              --   COMPLETE          → SUBMITTED
              --   SUBMITTED         → APPROVED / COMPLETE (request-changes)
              --   APPROVED          → LOCKED / ARCHIVED
              --   LOCKED            → ARCHIVED only
              --   ARCHIVED          terminal
              CREATE OR REPLACE FUNCTION enforce_evaluation_lock_immutability()
              RETURNS trigger AS $$
              BEGIN
                IF OLD.status = NEW.status THEN
                  RETURN NEW;
                END IF;
                IF OLD.status = 'ARCHIVED' THEN
                  RAISE EXCEPTION 'EVALUATION_LOCKED: archived evaluation cannot be modified (id=%)', OLD.id
                    USING ERRCODE = '23514';
                END IF;
                IF OLD.status = 'LOCKED' AND NEW.status NOT IN ('ARCHIVED') THEN
                  RAISE EXCEPTION 'EVALUATION_LOCKED: locked evaluation (id=%) can only transition to ARCHIVED, attempted=%',
                    OLD.id, NEW.status
                    USING ERRCODE = '23514';
                END IF;
                IF OLD.status = 'APPROVED' AND NEW.status NOT IN ('LOCKED','ARCHIVED') THEN
                  RAISE EXCEPTION 'EVALUATION_LOCKED: approved evaluation (id=%) cannot regress to %',
                    OLD.id, NEW.status
                    USING ERRCODE = '23514';
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS trg_evaluation_status_immutability ON evaluations;
              CREATE TRIGGER trg_evaluation_status_immutability
                BEFORE UPDATE OF status ON evaluations
                FOR EACH ROW
                EXECUTE FUNCTION enforce_evaluation_lock_immutability();

              -- evaluation_scores immutability: prevent any modification when
              -- parent evaluation.status IN (LOCKED, ARCHIVED). APPROVED still
              -- allows score updates so the calibration use case can write
              -- through; the app-layer EvaluationImmutabilityPolicy gates
              -- regular EDITs on APPROVED.
              CREATE OR REPLACE FUNCTION prevent_score_changes_on_locked_evaluation()
              RETURNS trigger AS $$
              DECLARE
                v_status TEXT;
                v_evaluation_id UUID;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  v_evaluation_id := OLD.evaluation_id;
                ELSE
                  v_evaluation_id := NEW.evaluation_id;
                END IF;
                SELECT status INTO v_status FROM evaluations WHERE id = v_evaluation_id;
                IF v_status IN ('LOCKED','ARCHIVED') THEN
                  RAISE EXCEPTION 'EVALUATION_LOCKED: cannot modify scores of evaluation (id=%, status=%)',
                    v_evaluation_id, v_status
                    USING ERRCODE = '23514';
                END IF;
                IF TG_OP = 'DELETE' THEN RETURN OLD; END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS trg_evaluation_score_lock ON evaluation_scores;
              CREATE TRIGGER trg_evaluation_score_lock
                BEFORE INSERT OR UPDATE OR DELETE ON evaluation_scores
                FOR EACH ROW
                EXECUTE FUNCTION prevent_score_changes_on_locked_evaluation();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_evaluation_score_lock ON evaluation_scores;
              DROP TRIGGER IF EXISTS trg_evaluation_status_immutability ON evaluations;
              DROP FUNCTION IF EXISTS prevent_score_changes_on_locked_evaluation();
              DROP FUNCTION IF EXISTS enforce_evaluation_lock_immutability();

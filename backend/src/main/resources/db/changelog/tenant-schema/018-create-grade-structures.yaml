                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - sql:
            sql: |
              ALTER TABLE grade_bands
                ADD CONSTRAINT fk_grade_bands_tenant
                FOREIGN KEY (tenant_id) REFERENCES public.tenants(id)
                ON DELETE RESTRICT ON UPDATE NO ACTION;
              ALTER TABLE grade_bands
                ADD CONSTRAINT fk_grade_bands_grade
                FOREIGN KEY (grade_id) REFERENCES grades(id)
                ON DELETE CASCADE;
              ALTER TABLE grade_bands
                ADD CONSTRAINT fk_grade_bands_structure
                FOREIGN KEY (grade_structure_id) REFERENCES grade_structures(id)
                ON DELETE CASCADE;
              ALTER TABLE grade_bands
                ADD CONSTRAINT chk_grade_bands_min_le_max
                CHECK (min_score <= max_score);
              ALTER TABLE grade_bands
                ADD CONSTRAINT chk_grade_bands_min_non_negative
                CHECK (min_score >= 0);

              CREATE UNIQUE INDEX uq_grade_bands_grade
                ON grade_bands (tenant_id, grade_id);
              CREATE INDEX idx_grade_bands_structure_min
                ON grade_bands (tenant_id, grade_structure_id, min_score);
      rollback:
        - sql:

# Phase 6 — grade_structures + grades + grade_bands tables
# (database-blueprint §5.2, architecture §15.3 + §15.4).
#
# Aggregate root: grade_structures — container with state machine
#   DRAFT → APPROVED → LOCKED → ARCHIVED. APPROVED + LOCKED are immutable;
#   any edit must call create-new-version.
#
# Aggregate: grades — one row per grade number inside the structure.
# Aggregate: grade_bands — min/max score range mapping score → grade.
#
# Hard constraints:
#   - unique (tenant, project_id, code) on grade_structures, where project NULL
#     means global tenant-level template (partial unique index).
#   - unique (tenant, grade_structure_id, grade_number) on grades.
#   - min_score <= max_score on grade_bands (CHECK).
#   - status / gap_policy / structure_type CHECK constraints match domain enums.
#   - DB triggers (in 014-phase4-style):
#       prevent_grade_changes_on_locked_structure: rejects INSERT/UPDATE/DELETE
#         on grades + grade_bands when parent grade_structure.status in
#         (APPROVED, LOCKED, ARCHIVED).
#       prevent_grade_structure_status_regression: rejects LOCKED→APPROVED,
#         ARCHIVED→anything, APPROVED→DRAFT.
databaseChangeLog:

  - changeSet:
      id: tenant-018-create-grade-structures
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase6
      changes:
        - createTable:
            tableName: grade_structures
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: name_i18n
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: description_i18n
                  type: JSONB
              - column:
                  name: structure_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: version_number
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: previous_version_id
                  type: UUID
              - column:
                  name: gap_policy
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: approved_at
                  type: TIMESTAMPTZ
              - column:
                  name: approved_by
                  type: UUID
              - column:
                  name: locked_at
                  type: TIMESTAMPTZ
              - column:
                  name: locked_by
                  type: UUID
              - column:
                  name: archived_at
                  type: TIMESTAMPTZ
              - column:
                  name: archived_by
                  type: UUID
              # standard audit columns
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - sql:
            sql: |
              ALTER TABLE grade_structures
                ADD CONSTRAINT fk_grade_structures_tenant
                FOREIGN KEY (tenant_id) REFERENCES public.tenants(id)
                ON DELETE RESTRICT ON UPDATE NO ACTION;
              ALTER TABLE grade_structures
                ADD CONSTRAINT fk_grade_structures_project
                FOREIGN KEY (project_id) REFERENCES projects(id) ON DELETE RESTRICT;
              ALTER TABLE grade_structures
                ADD CONSTRAINT fk_grade_structures_previous
                FOREIGN KEY (previous_version_id) REFERENCES grade_structures(id);
              ALTER TABLE grade_structures
                ADD CONSTRAINT chk_grade_structures_status
                CHECK (status IN ('DRAFT','APPROVED','LOCKED','ARCHIVED'));
              ALTER TABLE grade_structures
                ADD CONSTRAINT chk_grade_structures_type
                CHECK (structure_type IN ('GRADE_14','GRADE_16','CUSTOM'));
              ALTER TABLE grade_structures
                ADD CONSTRAINT chk_grade_structures_gap_policy
                CHECK (gap_policy IN ('STRICT_NO_GAPS','ALLOW_GAPS_WARN'));
              ALTER TABLE grade_structures
                ADD CONSTRAINT chk_grade_structures_version_number
                CHECK (version_number >= 1);

              CREATE UNIQUE INDEX uq_grade_structures_tenant_project_code
                ON grade_structures (tenant_id, project_id, code)
                WHERE project_id IS NOT NULL;
              CREATE UNIQUE INDEX uq_grade_structures_tenant_global_code
                ON grade_structures (tenant_id, code)
                WHERE project_id IS NULL;
              CREATE INDEX idx_grade_structures_tenant_status
                ON grade_structures (tenant_id, status);
              CREATE INDEX idx_grade_structures_tenant_project
                ON grade_structures (tenant_id, project_id);
              CREATE INDEX idx_grade_structures_previous_version
                ON grade_structures (previous_version_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_grade_structures_previous_version;
              DROP INDEX IF EXISTS idx_grade_structures_tenant_project;
              DROP INDEX IF EXISTS idx_grade_structures_tenant_status;
              DROP INDEX IF EXISTS uq_grade_structures_tenant_global_code;
              DROP INDEX IF EXISTS uq_grade_structures_tenant_project_code;
        - dropTable:
            tableName: grade_structures

  - changeSet:
      id: tenant-018-create-grades
      author: backend-engineer

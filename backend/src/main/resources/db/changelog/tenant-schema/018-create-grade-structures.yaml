            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: grade_structure_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: grade_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: name_i18n
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: description_i18n
                  type: JSONB
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              # standard audit columns
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - sql:
            sql: |
              ALTER TABLE grades
                ADD CONSTRAINT fk_grades_tenant
                FOREIGN KEY (tenant_id) REFERENCES public.tenants(id)

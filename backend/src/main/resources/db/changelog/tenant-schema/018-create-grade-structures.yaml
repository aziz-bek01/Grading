              DROP INDEX IF EXISTS idx_grade_bands_structure_min;
              DROP INDEX IF EXISTS uq_grade_bands_grade;
        - dropTable:
            tableName: grade_bands

  - changeSet:
      id: tenant-018-grade-structure-immutability-triggers
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase6
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              -- DB-level safeguard #1: prevent grade-structure status regression.
              -- DRAFT     → APPROVED / ARCHIVED
              -- APPROVED  → LOCKED / ARCHIVED
              -- LOCKED    → ARCHIVED
              -- ARCHIVED  → terminal
              CREATE OR REPLACE FUNCTION prevent_grade_structure_status_regression()
              RETURNS trigger AS $$
              BEGIN
                IF OLD.status = NEW.status THEN
                  RETURN NEW;
                END IF;
                IF OLD.status = 'ARCHIVED' THEN
                  RAISE EXCEPTION 'GRADE_STRUCTURE_LOCKED: archived grade structure cannot be modified (id=%)', OLD.id
                    USING ERRCODE = '23514';
                END IF;
                IF OLD.status = 'LOCKED' AND NEW.status NOT IN ('ARCHIVED') THEN
                  RAISE EXCEPTION 'GRADE_STRUCTURE_LOCKED: locked structure (id=%) can only transition to ARCHIVED, attempted=%', OLD.id, NEW.status
                    USING ERRCODE = '23514';
                END IF;
                IF OLD.status = 'APPROVED' AND NEW.status NOT IN ('LOCKED','ARCHIVED') THEN
                  RAISE EXCEPTION 'GRADE_STRUCTURE_LOCKED: approved structure (id=%) cannot regress to %', OLD.id, NEW.status
                    USING ERRCODE = '23514';
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS trg_grade_structure_status_regression ON grade_structures;
              CREATE TRIGGER trg_grade_structure_status_regression
                BEFORE UPDATE OF status ON grade_structures
                FOR EACH ROW
                EXECUTE FUNCTION prevent_grade_structure_status_regression();

              -- DB-level safeguard #2: reject grade/grade_band writes when
              -- parent structure is APPROVED, LOCKED or ARCHIVED.
              CREATE OR REPLACE FUNCTION prevent_grade_changes_on_locked_structure()
              RETURNS trigger AS $$
              DECLARE
                v_status TEXT;
                v_structure_id UUID;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  v_structure_id := OLD.grade_structure_id;
                ELSE
                  v_structure_id := NEW.grade_structure_id;
                END IF;
                SELECT status INTO v_status FROM grade_structures WHERE id = v_structure_id;
                IF v_status IN ('APPROVED','LOCKED','ARCHIVED') THEN
                  RAISE EXCEPTION 'GRADE_STRUCTURE_LOCKED: cannot modify grades of structure (id=%, status=%)',
                    v_structure_id, v_status
                    USING ERRCODE = '23514';
                END IF;
                IF TG_OP = 'DELETE' THEN RETURN OLD; END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS trg_grades_lock ON grades;
              CREATE TRIGGER trg_grades_lock
                BEFORE INSERT OR UPDATE OR DELETE ON grades
                FOR EACH ROW
                EXECUTE FUNCTION prevent_grade_changes_on_locked_structure();

              DROP TRIGGER IF EXISTS trg_grade_bands_lock ON grade_bands;
              CREATE TRIGGER trg_grade_bands_lock
                BEFORE INSERT OR UPDATE OR DELETE ON grade_bands
                FOR EACH ROW
                EXECUTE FUNCTION prevent_grade_changes_on_locked_structure();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_grade_bands_lock ON grade_bands;
              DROP TRIGGER IF EXISTS trg_grades_lock ON grades;
              DROP TRIGGER IF EXISTS trg_grade_structure_status_regression ON grade_structures;
              DROP FUNCTION IF EXISTS prevent_grade_changes_on_locked_structure();
              DROP FUNCTION IF EXISTS prevent_grade_structure_status_regression();

  - changeSet:
      id: tenant-018-evaluations-grade-band-fk
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase6
      changes:
        - sql:
            sql: |
              -- Phase 5 left evaluations.grade_band_id nullable + unreferenced.
              -- Phase 6 introduces grade_bands — add the FK now.
              ALTER TABLE evaluations
                ADD CONSTRAINT fk_evaluations_grade_band
                FOREIGN KEY (grade_band_id) REFERENCES grade_bands(id)
                ON DELETE SET NULL;
              CREATE INDEX idx_evaluations_grade_band
                ON evaluations (tenant_id, grade_band_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_evaluations_grade_band;
              ALTER TABLE evaluations DROP CONSTRAINT IF EXISTS fk_evaluations_grade_band;

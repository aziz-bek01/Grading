  - changeSet:
      id: tenant-018-create-grade-bands
      author: backend-engineer
      context: mode-shared
      labels: mvp1,phase6
      changes:
        - createTable:
            tableName: grade_bands
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: grade_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: grade_structure_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: min_score
                  type: NUMERIC(12,4)
                  constraints:
                    nullable: false
              - column:
                  name: max_score
                  type: NUMERIC(12,4)
                  constraints:
                    nullable: false
              # standard audit columns
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ

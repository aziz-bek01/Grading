# MVP 1 — PostgreSQL Row-Level Security (RLS) defense-in-depth.
#
# Background:
#   In `mode-shared` (the current MVP 1 default) every tenant table lives in
#   the `public` schema and isolation is enforced **only** by the application's
#   `tenant_id` predicate. If a repository forgets the filter, or a native
#   query is mis-written, one tenant's rows can leak to another. RLS shuts
#   that door at the database level.
#
# Strategy (architecture §6.2, security-blueprint §7.3):
#   - Enable + FORCE RLS on every tenant-aware table in `public`.
#   - Policy: row visible/writable iff
#       tenant_id = current_setting('app.tenant_id', true)::uuid
#   - The session GUC `app.tenant_id` is set per request by
#     TenantContextFilter via `SET LOCAL app.tenant_id = ...` inside the
#     transaction Spring opens for that request.
#   - `FORCE ROW LEVEL SECURITY` ensures the policy applies even to the
#     table owner (otherwise PostgreSQL exempts owners from RLS).
#
# Role behaviour:
#   - `grading_migrator` is the DB owner / superuser-equivalent and BYPASSES
#     RLS — required so Liquibase can run DDL/DML across tenants and so
#     audit-table seeds work.
#   - `grading_runtime` is the application runtime role; it is NOT a superuser
#     and is subject to FORCE RLS. Any query it issues without a tenant GUC
#     returns ZERO rows (current_setting returns NULL on missing, NULL::uuid
#     comparison is unknown → predicate fails).
#   - `grading_audit_reader` is read-only on audit tables; it must SET the
#     GUC explicitly when reading tenant_audit_logs.
#
# Idempotency:
#   - `ALTER TABLE ... ENABLE/FORCE ROW LEVEL SECURITY` is a no-op if already
#     set, so safe on re-run.
#   - `DROP POLICY IF EXISTS` precedes `CREATE POLICY` so the changeset can
#     be re-applied (e.g. after a rollback) without colliding.
#
# Rollback:
#   - Drops every policy and disables RLS on every listed table.
#
# Out of scope (Phase 2+):
#   - schema-per-tenant deployment: when each tenant lives in its own schema
#     the policy still applies but the GUC strategy is identical.
#   - control-plane tables (tenants, users, system_audit_log, ...) are NOT
#     subject to tenant RLS — they are application-wide and gated by app-layer
#     RBAC/ABAC.
databaseChangeLog:

  - changeSet:
      id: tenant-030-enable-row-level-security
      author: database-architect
      context: mode-shared
      labels: mvp1,security,defense-in-depth,rls
      comment: |
        Enable + FORCE RLS on every tenant-aware table in public schema.
        Policy: tenant_id = current_setting('app.tenant_id', true)::uuid.
        grading_runtime is subject to RLS; grading_migrator bypasses (superuser).

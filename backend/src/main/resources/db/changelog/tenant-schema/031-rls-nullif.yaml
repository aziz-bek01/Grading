# MVP 1 — RLS policy hardening: blank-safe tenant GUC (defense-in-depth).
#
# Background:
#   Changelog 030-enable-rls.yaml created tenant-isolation policies of the form
#       USING/WITH CHECK (tenant_id = current_setting('app.tenant_id', true)::uuid)
#   A PostgreSQL CUSTOM GUC (app.*) does NOT revert to NULL between uses — once
#   any SET LOCAL has touched it in the session it reverts to the EMPTY STRING
#   "". When the runtime role (grading_runtime, which is subject to FORCE ROW
#   LEVEL SECURITY and has no BYPASSRLS) issues a query without the GUC bound to
#   the current transaction, current_setting('app.tenant_id', true) returns ""
#   and the policy evaluates ''::uuid -> ERROR 22P02
#   ("invalid input syntax for type uuid: """), which the API surfaced as 409.
#
#   The primary fix (RlsTenantSessionAspect) binds the GUC inside the active
#   transaction so legitimate requests now match their own rows. THIS migration
#   is the belt-and-braces companion: it re-creates every policy so that a
#   missing OR empty GUC yields ZERO ROWS instead of raising 22P02 —
#       tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid
#   NULLIF("", "") -> NULL, NULL::uuid is NULL, and (tenant_id = NULL) is
#   UNKNOWN -> the row is filtered out. Fail-closed, never an error.
#
# Scope:
#   Same tables and same policy names as 030 — kept in lock-step. Whenever 030
#   changes, mirror it here.
#
# Idempotency:
#   DROP POLICY IF EXISTS precedes each CREATE POLICY, so this changeset can be
#   re-applied after a rollback without colliding.
#
# Role behaviour (unchanged from 030):
#   - grading_migrator runs this DDL (owner / BYPASSRLS).
#   - grading_runtime is subject to FORCE RLS; with no/empty GUC it now sees
#     zero rows instead of 22P02.
#
# Rollback:
#   Restores the original 030 expression (raw ::uuid cast).
databaseChangeLog:

  - changeSet:
      id: tenant-031-rls-nullif-blank-safe
      author: backend-engineer
      context: mode-shared
      labels: mvp1,security,defense-in-depth,rls,blank-safe
      comment: |
        Re-create every tenant-isolation policy from 030 with a blank-safe GUC
        expression: tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid.
        A missing/empty app.tenant_id now yields zero rows instead of 22P02.
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- 001 projects
              DROP POLICY IF EXISTS tenant_isolation_projects ON public.projects;
              CREATE POLICY tenant_isolation_projects ON public.projects
                USING       (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid)
                WITH CHECK  (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid);


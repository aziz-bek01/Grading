  # Epic E — tenant-scoped DB-backed CUSTOM methodology templates
  # (save-methodology-version-as-template). Built-ins stay in the in-memory
  # MethodologyTemplateRegistry. Self-contained: creates its own table + RLS
  # policy (NULLIF blank-safe, in lock-step with 030/031). Depends only on
  # public.tenants (control-plane 001); runs after the methodology tables for
  # locality.
  - include:
      file: 032-create-methodology-templates.yaml
      relativeToChangelogFile: true
  # BE-7 — tenant-scoped DB-backed CUSTOM grade templates (save-grade-structure-
  # as-template). EXACT mirror of 032 for the grade module. Built-ins stay in the
  # in-memory GradeStructureTemplateRegistry. Self-contained: creates its own
  # table + RLS policy (NULLIF blank-safe, in lock-step with 030/031/032). Depends
  # only on public.tenants (control-plane 001); runs after the grade structure
  # tables for locality. Re-applied by TenantSchemaProvisioner for schema-per-tenant.
  - include:
      file: 033-create-grade-templates.yaml
      relativeToChangelogFile: true
  # MVP2 multi-evaluator (panel/campaign). Apply order 034 -> 038:
  #   034 additive tables (panels/assignments/factor-averages) + relocated uniqueness
  #   035 additive nullable panel_id + evaluator_role on evaluations
  #   036 idempotent backfill of legacy evaluations into min_evaluators=1 panels +
  #       ordering-sensitive uniqueness swap (evaluations one-active index relaxed)
  #   037 RLS FORCE + blank-safe NULLIF policies for the three new tables
  #   038 seed EVALUATION_PANEL_MANAGE / EVALUATION_PANEL_APPROVE / CAMPAIGN_RESULTS_VIEW
  - include:
      file: 034-create-evaluation-panels.yaml
      relativeToChangelogFile: true
  - include:
      file: 035-evaluations-add-panel-fk.yaml
      relativeToChangelogFile: true
  - include:
      file: 036-backfill-panels-from-evaluations.yaml
      relativeToChangelogFile: true
  - include:
      file: 037-rls-panels.yaml
      relativeToChangelogFile: true
  - include:
      file: 038-seed-panel-permissions.yaml
      relativeToChangelogFile: true
  # methodology-approved-edit (DA-1/2/3): let an audited SUPER_ADMIN edit scoring
  # fields on an APPROVED methodology version while preserving already-evaluated
  # positions byte-for-byte. Apply order 039 -> 042:
  #   039 additive nullable methodology_basis_snapshot (JSONB) +
  #       methodology_basis_snapshot_at (TIMESTAMPTZ) on evaluations (DA-1 part A)
  #   040 set-based, idempotent, tenant-scoped backfill of that snapshot for every
  #       non-archived evaluation from its version's CURRENT factors/levels — MUST
  #       run before the approved-edit feature is enabled (DA-1 part B). Ordered
  #       strictly AFTER 039 (the column must exist first).
  #   041 additive nullable deprecated_at/deprecated_by + partial active-only
  #       indexes on factors / factor_levels for soft "remove" (DA-2). Independent.
  #   042 GUC-gated (app.methodology_approved_edit='on') APPROVED carve-out in the
  #       factor / factor_level immutability triggers; LOCKED/ARCHIVED stay hard-
  #       immutable (DA-3). CREATE OR REPLACE only — 011 untouched. Independent.
  - include:
      file: 039-evaluations-add-methodology-basis-snapshot.yaml
      relativeToChangelogFile: true
  - include:
      file: 040-backfill-methodology-basis-snapshot.yaml
      relativeToChangelogFile: true
  - include:
      file: 041-factors-levels-soft-deprecate.yaml
      relativeToChangelogFile: true
  - include:
      file: 042-factor-triggers-approved-edit-carveout.yaml
      relativeToChangelogFile: true
  # panel-reopen-for-additional-expert (Feature 2): GUC-gated
  # (app.panel_reopen_in_progress='on') controlled un-lock carve-out in the
  # evaluation lock-immutability trigger — a LOCKED contributing sheet may go
  # back to COMPLETE (editable) ONLY inside the audited
  # ReopenApprovedPanelForExpertUseCase tx that set the flag. LOCKED->{anything
  # else} and ARCHIVED/APPROVED no-regress stay hard-immutable. CREATE OR
  # REPLACE only — 015 untouched. Mirrors the 042 GUC carve-out style; ordered
  # strictly AFTER 042. Independent of 039-042.
  - include:
      file: 043-evaluation-reopen-unlock-carveout.yaml
      relativeToChangelogFile: true

  # Widen chk_approval_requests_entity_type to include EVALUATION_PANEL so a panel
  # can be submitted to the CEO (and re-approved after reopen-for-expert) — 021's
  # constraint predated the panel approval entity type.
  - include:
      file: 044-approval-requests-allow-evaluation-panel.yaml
      relativeToChangelogFile: true

  # Batch 4 — uniform bounded-retry + dead-letter for the import/export/report
  # async workers (D6: keep in-process ThreadPoolTaskExecutor + a @Scheduled
  # re-queuer; no broker). Adds attempt_count / failure_reason / next_attempt_at
  # where missing and widens the three status CHECKs to admit a terminal
  # DEAD_LETTER value (strict superset of the prior lists — mirrors 044).
  - include:
      file: 045-worker-retry-dead-letter.yaml
      relativeToChangelogFile: true

  # REQ-CEO — CLIENT_CEO role: org-wide oversight + the dedicated evaluation-panel
  # sign-off authority, DISTINCT from CLIENT_HR_DIRECTOR. Additive forward-only seed
  # (002/004/038 stay immutable). MUST run AFTER 038 because it (a) grants catalogue
  # codes that 038 + earlier seeds inserted into public.permissions, and (b) performs
  # the STRICT-ROUTING DELETE of the CLIENT_HR_DIRECTOR -> EVALUATION_PANEL_APPROVE
  # row that 038 line ~56 seeded, so panel sign-off reroutes to the CEO (by
  # requiredPermission — no routing-code change).
  - include:
      file: 046-seed-client-ceo-role.yaml
      relativeToChangelogFile: true

  # MVP2 panel-approval reconciliation — relax approval_requests.requested_by to
  # NULLABLE so SYSTEM-opened CEO sign-offs (PanelApprovalReconciliationRunner,
  # null actor) can be inserted. Pure constraint relaxation; existing rows valid.
  - include:
      file: 047-approval-requests-nullable-requested-by.yaml
      relativeToChangelogFile: true

  # EPIC-001 — org-wide CEO panel list. Additive (tenant_id, status) index for
  # PanelRepository.findAllByTenantIdAndStatusIn (tenant + status IN, no project_id).
  # Not redundant with 034's project-LEADING idx_panels_tenant_project_status.
  - include:
      file: 048-panels-add-tenant-status-index.yaml
      relativeToChangelogFile: true

  # DB-021 (T2 perf) — FK-LEADING indexes for CASCADE-delete children. Parent
  # ON DELETE CASCADE fires an internal single-column probe
  # (DELETE FROM child WHERE <fk> = $1) that a tenant-leading (tenant_id, fk, …)
  # composite cannot serve, forcing a seq scan (worst on evaluation_scores /
  # import_batch_rows / import_errors). Adds a plain FK-leading index per
  # genuine CASCADE hotspot that lacked one. Purely additive.
  - include:
      file: 049-cascade-child-fk-leading-indexes.yaml
      relativeToChangelogFile: true

  # DB-022 (T2 perf) — org-wide approval-status dashboards filter
  # (tenant_id, current_status) with no project_id; 021's
  # (tenant_id, project_id, current_status) has project_id LEADING status, so it
  # cannot serve them. Adds idx_approval_requests_tenant_status. Additive.
  - include:
      file: 050-approval-requests-add-tenant-status-index.yaml
      relativeToChangelogFile: true

  # DB-030 (LOW perf) — partial index for the UNASSIGNED-PENDING branch of
  # ApprovalStepRepository.findInbox (approver_user_id IS NULL AND status='PENDING',
  # keyed on (tenant_id, required_permission) so the required-permission IN-list is
  # an index scan, not a heap filter). Complements — does not duplicate — 021's
  # full idx_approval_steps_tenant_approver_status (which lacks required_permission
  # and is not partial). Additive.
  - include:
      file: 051-approval-steps-unassigned-inbox-index.yaml
      relativeToChangelogFile: true

  # DB-031 (LOW perf) — (tenant_id, factor_level_id) index on evaluation_scores,
  # backing the factor-level soft-deprecate guard
  # (existsByTenantIdAndFactorLevelId, BE-4) and the RESTRICT FK probe. No
  # existing evaluation_scores index contains factor_level_id. Additive.
  - include:
      file: 052-evaluation-scores-factor-level-index.yaml
      relativeToChangelogFile: true

  # DB-051 (LOW integrity) — add the missing project_id FKs on import_batches and
  # file_attachments -> projects(id) ON DELETE CASCADE, mirroring the sibling
  # artifact children export_jobs (025) / reports (028). import_batches.project_id
  # is nullable (NULLs exempt); file_attachments.project_id is NOT NULL.
  - include:
      file: 053-import-attachment-project-fks.yaml
      relativeToChangelogFile: true


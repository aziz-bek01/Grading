# Master tenant-schema changelog.
#
# Two execution paths (database-blueprint §10, Phase 2 implementation):
#   1. mode-shared:        included by db.changelog-master.yaml under
#                          the `mode-shared` context — table DDL lives in
#                          the `public` schema for local dev / integration
#                          tests (single Liquibase run, no provisioning saga).
#   2. schema-per-tenant:  invoked programmatically by
#                          TenantSchemaProvisioner.provision(tenant) — the
#                          same YAML, applied against the new tenant schema
#                          with `default_schema_name` parameter. Reserved
#                          for production deployment (post-MVP 1).

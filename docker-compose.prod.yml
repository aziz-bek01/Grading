# =============================================================================
# grading.hrlab.uz — PRODUCTION docker compose for a SHARED VPS.
# =============================================================================
# This file runs grading.hrlab.uz alongside OTHER subdomains + their own
# Postgres databases already on the VPS. It is built to COEXIST and NOT touch
# anything else:
#
#   * Every container / network / volume is namespaced `grading-*`.
#   * The app containers bind ONLY to 127.0.0.1 on unique high ports
#       grading-api      -> 127.0.0.1:18080
#       grading-frontend -> 127.0.0.1:18081
#     so they NEVER clash with the existing host services or the host's
#     reverse proxy. The OUTER proxy (host nginx or Traefik — see
#     infra/reverse-proxy/) terminates TLS for grading.hrlab.uz and routes
#     /api -> 18080, everything else -> 18081.
#   * The dedicated grading Postgres has NO published host port — it is only
#     reachable on the internal `grading-prod` docker network, so it cannot
#     collide with or affect the other subdomains' Postgres on 5432.
#
# Images are pulled from GHCR by IMMUTABLE tag (sha-<short> or a SemVer) —
# never `latest`. The CD pipeline sets IMAGE_TAG.
#
# Usage on the VPS (the CD pipeline does this for you):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm grading-migrator
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d grading-api grading-frontend
#
# All secrets/config come from .env.prod (NEVER committed — see .env.prod.example).
# Reuses backend/Dockerfile + frontend/Dockerfile images already built+pushed
# by .github/workflows/ci.yml. This compose NEVER builds — it only pulls.
# =============================================================================

# Anchors for repeated security + logging blocks.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ---------------------------------------------------------------------------
  # Dedicated grading Postgres — ISOLATED.
  #   * No host port -> cannot clash with other subdomains' :5432.
  #   * Own named volume `grading-pg-data-prod`.
  #   * Internal network only.
  #   * Created with the bootstrap superuser (POSTGRES_USER) which owns the
  #     dedicated grading database. The grading_migrator / grading_runtime /
  #     grading_audit_reader roles are created by Liquibase (changelog 005) and
  #     given LOGIN + passwords by the first-time-setup SQL in
  #     infra/db/prod/01-create-prod-roles.sql (mounted read-only below).
  #
  # TOGGLE — external Postgres instead of this container:
  #   If you prefer to reuse an EXISTING Postgres already on the VPS, set
  #   GRADING_USE_EXTERNAL_DB=true in .env.prod, comment out this service +
  #   the api/migrator `depends_on: grading-postgres`, and point
  #   SPRING_DATASOURCE_URL / LIQUIBASE url at that server using a SEPARATE
  #   database + the three SEPARATE roles. Default = this isolated container.
  # ---------------------------------------------------------------------------
  grading-postgres:
    image: postgres:16-alpine
    container_name: grading-postgres-prod
    restart: unless-stopped
    profiles: ["db"]                       # disabled when using external DB (see toggle)
    # NO `ports:` block on purpose — internal-only, cannot collide with the host.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      # Keep the cluster small; tune for the shared VPS.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed by ./infra/db/prod/01-create-prod-roles.sh on FIRST init only,
      # to attach LOGIN + passwords to the three F-04 roles. From .env.prod.
      GRADING_MIGRATOR_PASSWORD: ${LIQUIBASE_DATASOURCE_PASSWORD}
      GRADING_RUNTIME_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      GRADING_AUDIT_READER_PASSWORD: ${GRADING_AUDIT_READER_PASSWORD}
    # Small-VPS tuning (2 GB box shared with quiz.hrlab.uz). Keeps Postgres RSS
    # modest so the JVM api + the existing services all fit. HikariCP defaults to
    # ~10 connections, so max_connections=40 is generous (api pool ~10).
    #
    # Memory math for the 320m mem_limit below:
    #   shared_buffers 80MB  + per-backend (work_mem 4MB * a few sorts * ~15 live
    #   backends worst case) + maintenance_work_mem 32MB + WAL/overhead. Observed
    #   RSS under light load ~58MB, so 320m leaves comfortable burst headroom for
    #   autovacuum / index builds without ballooning past the limit.
    command:
      - postgres
      - -c
      - shared_buffers=80MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes:
      - grading-pg-data-prod:/var/lib/postgresql/data
      # One-shot role bootstrap (LOGIN + passwords for the three F-04 roles).
      # Idempotent; runs ONLY on first init of an empty data volume.
      - ./infra/db/prod:/docker-entrypoint-initdb.d:ro
    networks: [grading-prod]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # ENFORCED hard limits — `docker compose up` (non-swarm) honors these
    # top-level keys; it IGNORES `deploy.resources.limits`. memswap_limit ==
    # mem_limit disables this container's access to host swap, so a Postgres
    # spike pages nothing and stays bounded (the JVM is the only thing we let
    # touch swap, and only as a crash-avoidance buffer). Kept in sync with the
    # documentary `deploy.resources` block below.
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.75
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 320M
        reservations:
          cpus: "0.10"
          memory: 96M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Liquibase migrator — ONE-SHOT. Runs as grading_migrator (DDL privileges).
  #   * Reuses the grading-api image (the boot jar embeds Liquibase + changelogs).
  #   * SPRING_PROFILES_ACTIVE=migrate -> there is NO application-migrate.yml, so
  #     Spring uses base application.yml whose liquibase.contexts are exactly
  #     `control-plane,seeds,mode-shared` (NO dev, NO test-roles). DevAuthFilter
  #     does NOT bind (`migrate` is not in DevAuthFilter.ALLOWED_PROFILES).
  #   * Web context disabled -> it migrates then exits 0.
  #   * Must run to completion BEFORE grading-api starts (CD runs it via
  #     `docker compose run --rm grading-migrator`).
  # ---------------------------------------------------------------------------
  grading-migrator:
    image: ghcr.io/${GHCR_REPO}/grading-api:${IMAGE_TAG}
    container_name: grading-migrator-prod
    profiles: ["migrate"]                  # only started explicitly by `compose run`
    pull_policy: always
    restart: "no"
    depends_on:
      grading-postgres:
        condition: service_healthy
        required: false                    # tolerate external-DB mode where pg is absent
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      # Migrator connects as grading_migrator (DDL). SEPARATE from runtime.
      SPRING_DATASOURCE_URL: ${LIQUIBASE_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${LIQUIBASE_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${LIQUIBASE_DATASOURCE_PASSWORD}
      # One-shot Liquibase run — a small heap is plenty. SerialGC + low metaspace
      # keeps its transient RSS modest so it does not contend with the still-
      # running old api during a deploy on the 2GB box.
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=55.0 -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      # Defense-in-depth: the DDL migrator never needs object storage and must
      # NEVER reach MinIO. Pin it to local-FS regardless of what .env.prod sets
      # for the runtime api. (Hardcoded, NOT env-overridable on purpose.)
      GRADING_STORAGE_TYPE: local
    # Run Liquibase update only, no Spring web server, then exit.
    # NOTE: $$JAVA_OPTS escapes Compose interpolation so the literal $JAVA_OPTS
    # reaches the shell and is expanded from the container env at runtime
    # (mirrors the backend Dockerfile ENTRYPOINT pattern).
    entrypoint:
      - sh
      - -c
      - >
        exec java $$JAVA_OPTS -jar /app/app.jar
        --spring.main.web-application-type=none
        --spring.liquibase.enabled=true
        --spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
    networks: [grading-prod]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    # ENFORCED limit — `compose run` (like `up`) ignores `deploy.resources`.
    # Capped at 512m so the transient migrator + the still-running old api fit
    # within the box during a deploy. memswap_limit gives a small swap cushion.
    mem_limit: 512m
    memswap_limit: 640m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # grading-api — Spring Boot, profile=prod, env-driven, runs as grading_runtime.
  #   * Binds ONLY to 127.0.0.1:18080 -> the host reverse proxy reaches it; the
  #     wider internet cannot. Real TLS is terminated by the outer proxy.
  #   * SPRING_PROFILES_ACTIVE=prod -> no application-prod.yml exists, so config
  #     is pure base application.yml + env. DevAuthFilter does NOT bind.
  #   * Real JWT via issuer-uri + audience; CORS pinned to https://grading.hrlab.uz.
  # ---------------------------------------------------------------------------
  grading-api:
    image: ghcr.io/${GHCR_REPO}/grading-api:${IMAGE_TAG}
    container_name: grading-api-prod
    restart: unless-stopped
    pull_policy: always
    depends_on:
      grading-postgres:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:18080:8080"             # localhost-only — coexists with host proxy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      # Enable Spring Boot liveness/readiness probe groups explicitly. Outside
      # Kubernetes these sub-endpoints are NOT auto-enabled, so without this the
      # container HEALTHCHECK + the CD smoke test (/actuator/health/readiness,
      # /actuator/health/liveness) would 404. K8s auto-enables them; on plain
      # Docker we must opt in. (Base application.yml exposes health,info only.)
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # --- Datasource: runtime role (DML; INSERT+SELECT only on audit) ---
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # The app must NOT run migrations at boot — the migrator job owns that.
      SPRING_LIQUIBASE_ENABLED: "false"
      # --- Real OAuth2/OIDC JWT validation ---
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${GRADING_JWT_ISSUER_URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCE: ${GRADING_JWT_AUDIENCE}
      # ZITADEL's JWKS lives at /oauth/v2/keys (NOT the Keycloak /protocol/... path
      # the decoder would otherwise derive). Must be injected for token validation.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${GRADING_JWT_JWK_SET_URI:-}
      # --- Multi-tenancy + CORS (same-origin SPA) ---
      GRADING_TENANCY_MODE: ${GRADING_TENANCY_MODE:-shared}
      GRADING_CORS_ALLOWED_ORIGINS: ${GRADING_CORS_ALLOWED_ORIGINS:-https://grading.hrlab.uz}
      # --- Salary field encryption (MVP1 stub key id/version; real KMS in MVP3) ---
      GRADING_SALARY_KEY_ID: ${GRADING_SALARY_KEY_ID:-prod-stub}
      GRADING_SALARY_KEY_VERSION: ${GRADING_SALARY_KEY_VERSION:-1}
      # --- IdP provisioning (decision doc 08, Option A — admin-set-password, NO SMTP) ---
      # When ENABLED=true, an admin invite ALSO creates/links a ZITADEL login
      # account so the invited user can sign in via OIDC. All four values are
      # sourced from .env.prod on the VPS (NEVER committed). GRADING_IDP_ZITADEL_TOKEN
      # is a machine-user PAT and a high-value platform secret — keep it out of git,
      # logs and images. Spring relaxed-binds these to grading.idp.zitadel.*.
      # Leave ENABLED unset/false to keep DB-only invites (no IdP side effects).
      GRADING_IDP_ZITADEL_ENABLED: ${GRADING_IDP_ZITADEL_ENABLED:-false}
      GRADING_IDP_ZITADEL_API_BASE: ${GRADING_IDP_ZITADEL_API_BASE:-}
      GRADING_IDP_ZITADEL_ORG_ID: ${GRADING_IDP_ZITADEL_ORG_ID:-}
      GRADING_IDP_ZITADEL_TOKEN: ${GRADING_IDP_ZITADEL_TOKEN:-}
      # --- Object storage (report/import artifacts) ---
      # OPT-IN, default = local-FS so this block changes NOTHING until an operator
      # flips GRADING_STORAGE_TYPE=minio in .env.prod on the VPS. Spring relaxed-
      # binds these to grading.storage.* (selected by grading.storage.type).
      #   * type unset/blank -> `local`: the api writes artifacts to its tmpfs /tmp
      #     path exactly as today; the grading-minio service stays DOWN (it is
      #     behind the `storage` profile and never starts).
      #   * type=minio -> the api reaches the internal MinIO at grading-minio:9000
      #     using the MINIO_ROOT_* creds; the bucket auto-creates on first use.
      # The access/secret keys default to the SAME MinIO root creds so a single
      # pair in .env.prod configures both the server and the client. They default
      # to "" when MinIO is not configured (the local path never reads them).
      GRADING_STORAGE_TYPE: ${GRADING_STORAGE_TYPE:-local}
      GRADING_STORAGE_MINIO_ENDPOINT: ${GRADING_STORAGE_MINIO_ENDPOINT:-http://grading-minio:9000}
      GRADING_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      GRADING_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      GRADING_STORAGE_MINIO_BUCKET: ${MINIO_BUCKET:-grading}
      GRADING_STORAGE_MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # --- JVM ---
      # Heap is sized as a percentage of the ENFORCED container limit (mem_limit
      # below). With mem_limit=820m and MaxRAMPercentage=62 -> max heap ~508MB,
      # leaving ~310MB for metaspace (capped at 192m), thread stacks, code cache,
      # direct buffers and the tmpfs writes — total RSS stays under 820m so the
      # OOM-killer never fires. The literal default here mirrors .env.prod's
      # API_JAVA_OPTS; .env.prod wins when present (keep the two in sync).
      JAVA_OPTS: ${API_JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=62.0 -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom}
    networks: [grading-prod]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /tmp/grading:size=256m
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # ENFORCED hard limits — honored by `docker compose up` (non-swarm), unlike
    # `deploy.resources.limits`. 820m comfortably exceeds the ~380MB working set
    # (and the ~508MB max heap), so the JVM never OOM-kills. memswap_limit is set
    # ABOVE mem_limit (820m RAM + 256m swap = 1076m total) so a transient spike
    # during cold-start warm-up can lean on swap as a crash-avoidance buffer
    # rather than being killed — but steady-state lives entirely in RAM.
    mem_limit: 820m
    memswap_limit: 1076m
    cpus: 1.0
    deploy:
      resources:
        limits:
          # Single-vCPU shared VPS: a container's cpus limit cannot exceed the
          # host's 1.00. Containers time-share, so 1.00 lets the JVM burst to the
          # whole core when postgres/frontend are idle.
          cpus: "1.0"
          memory: 820M
        reservations:
          cpus: "0.25"
          memory: 448M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # grading-frontend — Vite/React SPA served by nginx-unprivileged (uid 101).
  #   * Binds ONLY to 127.0.0.1:18081.
  #   * Does NOT proxy /api — the OUTER proxy splits /api vs / on grading.hrlab.uz
  #     so the SPA + API share one origin (CSP connect-src 'self').
  #   * config.json (apiBaseUrl=/api, environment=production) is injected at
  #     runtime from a host file mounted read-only, so we never rebuild the image
  #     to change runtime config.
  # ---------------------------------------------------------------------------
  grading-frontend:
    image: ghcr.io/${GHCR_REPO}/grading-frontend:${IMAGE_TAG}
    container_name: grading-frontend-prod
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - grading-api
    ports:
      - "127.0.0.1:18081:8080"             # localhost-only
    volumes:
      # Runtime config injected without rebuilding the image. The example file
      # lives at infra/frontend/config.json (apiBaseUrl=/api, env=production).
      - ./infra/frontend/config.json:/usr/share/nginx/html/config.json:ro
    networks: [grading-prod]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    # ENFORCED hard limits — honored by `docker compose up` (non-swarm). nginx
    # serving static assets uses ~2MB RSS; 64m is ample and disabling swap keeps
    # it predictable. memswap_limit == mem_limit -> no swap for the frontend.
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # grading-minio — S3-compatible object storage for report/import artifacts.
  #   OPT-IN + ISOLATED. Behind `profiles: ["storage"]` so it does NOT start
  #   with the default stack — it is only brought up when an operator enables
  #   MinIO (GRADING_STORAGE_TYPE=minio) and the deploy adds `--profile storage`.
  #
  #   INTERNAL-ONLY, NOT public:
  #     * NO public `ports:` for the S3 API (:9000). The api reaches it in-cluster
  #       at grading-minio:9000 over the private `grading-prod` bridge ONLY.
  #     * The web console (:9001) is bound to 127.0.0.1 ONLY (loopback on the
  #       VPS, never the public interface) for occasional operator access over an
  #       SSH tunnel. Remove the `ports:` line entirely to disable the console.
  #
  #   Credentials come from .env.prod (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD) —
  #   NEVER committed. These double as the api's access/secret key (see the
  #   grading-api GRADING_STORAGE_MINIO_* block above).
  # ---------------------------------------------------------------------------
  grading-minio:
    # Pinned, immutable MinIO release tag — never `latest`.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: grading-minio-prod
    restart: unless-stopped
    profiles: ["storage"]                  # never starts unless storage is enabled
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # Console ONLY on loopback (operator access via SSH tunnel). The S3 API
      # (:9000) is deliberately NOT published — internal network access only.
      - "127.0.0.1:19001:9001"
    volumes:
      - grading-minio-data:/data
    networks: [grading-prod]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # MinIO's built-in cluster readiness endpoint. `curl` is bundled in the
      # minio/minio image. Probes loopback :9000 INSIDE the container (the S3 API
      # is internal-only and not published to the host).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # ENFORCED hard limits — honored by `docker compose up` (non-swarm). MinIO is
    # lean for light artifact traffic on the 2GB box; 256m is ample. memswap_limit
    # == mem_limit -> no swap, keeps RSS predictable alongside the JVM api.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

volumes:
  grading-pg-data-prod:
    name: grading-pg-data-prod
  grading-minio-data:
    name: grading-minio-data

networks:
  grading-prod:
    name: grading-prod
    driver: bridge
    # Dedicated, isolated bridge — separate from any other compose project's
    # network. Other subdomains' containers are NOT attached here.

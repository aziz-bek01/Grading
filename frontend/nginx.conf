# grading.hrlab.uz frontend — nginx server block.
# Hardened for production: secure headers, SPA fallback, no directory listing.
# Loaded by /etc/nginx/conf.d/grading.conf inside the image.

# Hide nginx version everywhere (Server header + error pages).
server_tokens off;

# Gzip text assets. Brotli would be nicer but the upstream image lacks it.
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/xml+rss
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Security headers applied to every response.
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings, no symlink chasing.
    autoindex off;
    disable_symlinks on;

    # ----- Security headers (per devops-sre blueprint §18, security blueprint) -----
    add_header X-Frame-Options              "DENY"                                 always;
    add_header X-Content-Type-Options       "nosniff"                              always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"      always;
    add_header X-XSS-Protection             "0"                                    always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy      $csp_header                            always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                          always;
    add_header Cross-Origin-Resource-Policy "same-origin"                          always;

    # Cap upload sizes (frontend never uploads here — API takes uploads).
    client_max_body_size 1m;

    # Probe endpoint for Kubernetes / Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Runtime config (overridden by ConfigMap mount in K8s).
    # Must NEVER be cached.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
        try_files /config.json =404;
    }

    # index.html must never be cached — it pins the bundle hashes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
        try_files /index.html =404;
    }

    # Hashed Vite assets are immutable — cache them aggressively.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # SPA fallback — every non-asset path returns index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files / VCS leftovers defensively.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- HR LABORATORIES signature gradient (07b §3): blue -> violet -> magenta -->
    <linearGradient id="hrlBrand" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0739B9"/>
      <stop offset="0.55" stop-color="#6E2EE4"/>
      <stop offset="1" stop-color="#AB27FD"/>
    </linearGradient>
  </defs>
  <!-- Brand tile with clearspace padding -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#hrlBrand)"/>
  <!-- HRL monogram: H with an L foot, drawn white for contrast on the gradient -->
  <g fill="#FFFFFF">
    <rect x="13" y="12" width="5.2" height="24" rx="1.2"/>
    <rect x="29.8" y="12" width="5.2" height="24" rx="1.2"/>
    <rect x="13" y="21.4" width="22" height="5.2" rx="1.2"/>
    <rect x="29.8" y="30.8" width="9.5" height="5.2" rx="1.2"/>
  </g>
</svg>

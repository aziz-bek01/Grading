# =============================================================================
# auth.hrlab.uz — HOST nginx vhost (HTTP bootstrap, pre-TLS) for the ZITADEL IdP.
# =============================================================================
# Same managed pattern as the grading + quiz vhosts on this box:
#   1. Install this MINIMAL HTTP-only vhost, reload nginx.
#   2. Run `certbot --nginx -d auth.hrlab.uz`, which obtains the Let's Encrypt
#      cert and REWRITES this file in place to add the `listen 443 ssl` server
#      block + an HTTP->HTTPS redirect. (Don't hand-write the 443 block; let
#      certbot manage it, identical to the other vhosts.)
#
# COEXISTENCE: a SEPARATE server block keyed on `server_name auth.hrlab.uz` only.
# It does NOT touch the http{} block, the quiz vhost, or the grading vhost.
# `nginx -t && systemctl reload nginx` leaves quiz + grading serving untouched.
#
# Install (matches infra/vps + infra/reverse-proxy convention):
#   sudo cp auth.hrlab.uz.nginx.conf /etc/nginx/sites-available/auth.hrlab.uz
#   sudo ln -sf ../sites-available/auth.hrlab.uz /etc/nginx/sites-enabled/auth.hrlab.uz
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d auth.hrlab.uz --redirect
#
# ROUTING: everything for auth.hrlab.uz -> the localhost-bound ZITADEL container
#   ALL paths -> 127.0.0.1:18082  (the ZITADEL container from docker-compose.idp.yml)
#
# The container binds 127.0.0.1 ONLY, so nginx can reach it but the public
# internet cannot hit :18082 directly.
#
# IMPORTANT — ZITADEL speaks HTTP/2 cleartext (h2c) AND HTTP/1.1 on :8080. The
# OIDC + REST endpoints (/.well-known, /oauth/v2/*, /oidc/v1/*, console) work
# fine over HTTP/1.1 proxying, which is what this vhost uses. The gRPC management
# APIs need h2c (grpc_pass); the grading SPA only needs the OIDC endpoints, so
# plain proxy_pass HTTP/1.1 is sufficient for login + token + JWKS + logout.
# =============================================================================
server {
    server_name auth.hrlab.uz;

    # ZITADEL sets large auth cookies + the console is a sizeable SPA; give it
    # generous header + body limits. Login/token payloads are small, but the
    # console upload (branding assets) can be a few MB.
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;

        # Host + forwarded headers ZITADEL needs to emit correct https:// issuer
        # and endpoint URLs while TLS is terminated here (ExternalSecure=true,
        # container TLS disabled). ZITADEL trusts X-Forwarded-* from the proxy.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;

        # Keepalive upstream + WebSocket/upgrade passthrough (console live bits).
        proxy_set_header Connection         "";
        proxy_set_header Upgrade            $http_upgrade;

        # OIDC discovery/token calls are quick; the console can stream a bit.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
    }

    listen 80;
    listen [::]:80;
}

# -----------------------------------------------------------------------------
# After `certbot --nginx -d auth.hrlab.uz` runs, certbot rewrites the block above
# to add (roughly) the following — shown here for reference ONLY; do not paste it
# by hand, certbot manages it:
#
#   listen 443 ssl;            # managed by Certbot
#   ssl_certificate     /etc/letsencrypt/live/auth.hrlab.uz/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/auth.hrlab.uz/privkey.pem;
#   include /etc/letsencrypt/options-ssl-nginx.conf;
#   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#   ... plus a new `server { listen 80; ... return 301 https://$host$request_uri; }`
#   redirect block for auth.hrlab.uz.
#
# Optional hardening to add AFTER TLS is confirmed working (uncomment in the
# 443 block): HSTS on the IdP origin.
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# -----------------------------------------------------------------------------

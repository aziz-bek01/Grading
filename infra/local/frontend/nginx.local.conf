# =============================================================================
# grading.hrlab.uz frontend — LOCAL DEV nginx server block.
# =============================================================================
# DEV-ONLY. Used ONLY by infra/local/frontend/Dockerfile.local +
# docker-compose.local.yml. The PRODUCTION server block (frontend/nginx.conf)
# is UNCHANGED.
#
# Difference vs prod:
#   * Adds a reverse proxy: /api/v1/ -> http://backend:8080 (the grading-api
#     compose service). This makes the SPA + API SAME-ORIGIN on the local
#     frontend port, so the CSP `connect-src 'self'` works AND the passwordless
#     dev-auth flow (X-Dev-* headers) reaches the REAL local backend — not MSW.
#   * Everything else (secure headers, SPA fallback, caching) mirrors prod so
#     the local container behaves like the real one.
#
# The SPA's default API base URL is `/api/v1` (frontend/src/shared/config/env.ts
# -> VITE_API_BASE_URL ?? '/api/v1'). Backend controllers live under /api/v1/*
# (e.g. @RequestMapping("/api/v1/...")), with NO servlet context-path, so the
# proxy below maps request path -> backend path 1:1.
# =============================================================================

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/xml+rss
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Security headers. NOTE connect-src 'self' is sufficient because /api/v1 is
# proxied through THIS origin below — the browser never makes a cross-origin
# XHR, so no CORS preflight is needed for the dockerised local path.
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    disable_symlinks on;

    add_header X-Frame-Options              "DENY"                                 always;
    add_header X-Content-Type-Options       "nosniff"                              always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"      always;
    add_header X-XSS-Protection             "0"                                    always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy      $csp_header                            always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                          always;
    # NOTE: no Strict-Transport-Security here — local dev is plain HTTP and HSTS
    # would poison the browser for http://localhost. Prod nginx.conf keeps HSTS.

    client_max_body_size 25m;

    # Health probe for the compose HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # -------------------------------------------------------------------------
    # API reverse proxy -> the grading-api compose service.
    # `backend` is the compose service name; Docker's embedded DNS resolves it
    # on the shared `grading-local` network. 8080 is the container port.
    # -------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Generous read timeout for slower local first-hit / report endpoints.
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Runtime config — must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
        try_files /config.json =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
        try_files /index.html =404;
    }

    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# grading.hrlab.uz — HOST-LEVEL nginx vhost (reverse proxy on the shared VPS).
# =============================================================================
# Drop this into the EXISTING host nginx that already fronts the other
# subdomains, e.g.:
#     /etc/nginx/sites-available/grading.hrlab.uz.conf
#     ln -s ../sites-available/grading.hrlab.uz.conf /etc/nginx/sites-enabled/
#     nginx -t && systemctl reload nginx
#
# COEXISTENCE: this is a SEPARATE server block keyed on `server_name
# grading.hrlab.uz` only. It does NOT touch the http{} block or any other
# subdomain's server blocks. Reloading nginx leaves the other vhosts running.
#
# It terminates TLS for grading.hrlab.uz and routes SAME-ORIGIN:
#     /api/*                  -> grading-api      (127.0.0.1:18080)
#     /actuator/health*       -> grading-api      (health probes / smoke tests)
#     /v3/api-docs, /swagger* -> grading-api      (optional; remove to hide docs)
#     everything else         -> grading-frontend (127.0.0.1:18081, SPA)
#
# The app containers bind to 127.0.0.1 only, so nginx reaches them but the
# internet cannot hit them directly.
# =============================================================================

# Upstreams to the localhost-bound containers from docker-compose.prod.yml.
upstream grading_api {
    server 127.0.0.1:18080;
    keepalive 16;
}
upstream grading_frontend {
    server 127.0.0.1:18081;
    keepalive 16;
}

# ----- HTTP :80 — ACME challenge + redirect to HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name grading.hrlab.uz;

    # Let certbot serve the ACME challenge over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----- HTTPS :443 — the real vhost -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grading.hrlab.uz;

    # --- TLS (certbot / Let's Encrypt) ---
    # Obtain with:
    #   certbot certonly --webroot -w /var/www/certbot -d grading.hrlab.uz
    ssl_certificate     /etc/letsencrypt/live/grading.hrlab.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grading.hrlab.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:grading_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS is also set by the SPA nginx, but set it at the edge too for /api.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Uploads go through /api; allow a sane body size (tune per import limits).
    client_max_body_size 25m;

    # --- API: same-origin /api split -> grading-api -------------------------
    # The SPA reads /config.json -> apiBaseUrl="/api"; CSP connect-src 'self',
    # so api + SPA MUST be on this one origin. The backend serves under /api.
    location /api/ {
        proxy_pass http://grading_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        # Spring uses forward-headers-strategy=framework — these headers are honoured.
    }

    # --- Health probes / smoke tests -> grading-api -------------------------
    location /actuator/health {
        proxy_pass http://grading_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- OpenAPI docs (OPTIONAL). Comment this block out to hide docs in prod.
    location /v3/api-docs {
        proxy_pass http://grading_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui {
        proxy_pass http://grading_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA: everything else -> grading-frontend ---------------------------
    # The frontend image's own nginx serves the SPA + security headers + cache
    # policy + /index.html no-cache. We just forward.
    location / {
        proxy_pass http://grading_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

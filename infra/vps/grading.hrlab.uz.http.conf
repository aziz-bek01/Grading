# =============================================================================
# grading.hrlab.uz — HOST nginx vhost (HTTP bootstrap, pre-TLS).
# =============================================================================
# This is the MINIMAL HTTP-only vhost installed by infra/vps/bootstrap.sh BEFORE
# TLS is issued. We then run `certbot --nginx -d grading.hrlab.uz` which:
#   * obtains the Let's Encrypt certificate, and
#   * REWRITES this file in place to add the `listen 443 ssl` server block and
#     an HTTP->HTTPS redirect — exactly the same managed pattern already used by
#     the existing quiz.hrlab.uz vhost on this box.
#
# COEXISTENCE: a SEPARATE server block keyed on `server_name grading.hrlab.uz`
# only. It does NOT touch the http{} block, the quiz vhost, or anything else.
# `nginx -t && systemctl reload nginx` leaves quiz.hrlab.uz serving untouched.
#
# SAME-ORIGIN ROUTING (matches docker-compose.prod.yml localhost-bound ports):
#   /api/*            -> grading-api      127.0.0.1:18080
#   /actuator/health* -> grading-api      (probes / smoke tests; logs off)
#   everything else   -> grading-frontend 127.0.0.1:18081  (the SPA)
#
# The app containers bind to 127.0.0.1 ONLY, so nginx can reach them but the
# public internet cannot hit them directly.
# =============================================================================
server {
    server_name grading.hrlab.uz www.grading.hrlab.uz;

    # Imports go through /api; keep in step with backend upload limits.
    client_max_body_size 25m;

    # --- API: same-origin /api split -> grading-api -------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # --- Health probes / smoke tests -> grading-api -------------------------
    location /actuator/health {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- SPA: everything else -> grading-frontend ---------------------------
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    listen 80;
    listen [::]:80;
}
